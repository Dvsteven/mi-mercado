<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi Mercado</title>
<meta name="theme-color" content="#2f6b4f">
<meta name="description" content="Lista de compras, registro de precios y presupuesto de mercado">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f7f3ea;--card:#fffdf8;--ink:#2b2a26;--mut:#7a756a;--line:#e7e0d1;--pri:#2f6b4f;--pri2:#e4efe8;--warn:#b5651d;--warn2:#fbeee0;--bad:#b23b3b;--bad2:#f8e3e3;--ok:#2f7a3e}
@media (prefers-color-scheme:dark){:root{--bg:#171a17;--card:#202520;--ink:#ecebe5;--mut:#a3a397;--line:#323a32;--pri:#7cc59b;--pri2:#24392c;--warn:#e7a35f;--warn2:#3b2e20;--bad:#ee8a8a;--bad2:#3d2424;--ok:#7cc59b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{background:var(--pri);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 14px;position:sticky;top:0;z-index:5}
@media (prefers-color-scheme:dark){header{background:#1f3a2b}}
header h1{margin:0;font-size:17px;font-weight:650;display:flex;justify-content:space-between;align-items:center}
header small{opacity:.85;font-weight:400;font-size:12px}
.bud{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.bud div{background:rgba(255,255,255,.12);border-radius:10px;padding:6px 8px}
.bud b{display:block;font-size:15px}.bud span{font-size:11px;opacity:.85}
.bar{height:6px;background:rgba(255,255,255,.2);border-radius:4px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:4px}
main{padding:12px 16px;max-width:680px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
input,select,button,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
button{border:0;border-radius:10px;padding:9px 12px;background:var(--pri2);color:var(--pri);font-weight:600;cursor:pointer;white-space:nowrap}
button.p{background:var(--pri);color:#fff}
@media (prefers-color-scheme:dark){button.p{color:#10241a}}
button.g{background:transparent;color:var(--mut);padding:6px 8px}
button.d{background:var(--bad2);color:var(--bad)}
button.sm{padding:5px 9px;font-size:13px}
.it{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.it:first-of-type{border-top:0}
.it .n{flex:1;min-width:0}.it .n b{font-weight:550;display:block;overflow:hidden;text-overflow:ellipsis}
.it .n small,.mut{color:var(--mut);font-size:12.5px}
.it.done .n b{text-decoration:line-through;color:var(--mut)}
.ck{width:24px;height:24px;border-radius:7px;border:2px solid var(--pri);flex:none;display:grid;place-items:center;background:none;padding:0}
.done .ck{background:var(--pri);color:#fff}
.cat{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 2px}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:var(--pri2);color:var(--pri);margin:2px 4px 0 0}
.chip.w{background:var(--warn2);color:var(--warn)}.chip.b{background:var(--bad2);color:var(--bad)}
.price{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:8px 0 9px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px;line-height:1}
nav button.on{color:var(--pri)}
dialog{border:0;border-radius:18px;padding:0;width:min(94vw,460px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .in{padding:16px}
dialog h3{margin:0 0 12px;font-size:17px}
label{display:block;font-size:12.5px;color:var(--mut);margin:8px 0 3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.tip{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.tip:first-of-type{border-top:0}
.tip .e{font-size:22px;line-height:1.1}
.tip p{margin:2px 0 0;color:var(--mut);font-size:13.5px}
.hb{height:8px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:3px}.hb i{display:block;height:100%;background:var(--pri)}
table{width:100%;border-collapse:collapse;font-size:13.5px}td,th{padding:5px 4px;border-top:1px solid var(--line);text-align:left}th{color:var(--mut);font-weight:600;font-size:12px}
.links{display:flex;gap:6px;flex-wrap:wrap}.links a{text-decoration:none;font-size:13px;padding:6px 10px;border-radius:9px;background:var(--warn2);color:var(--warn);font-weight:600}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:20}
#toast.on{opacity:1}
details summary{cursor:pointer;font-weight:600;color:var(--pri);padding:4px 0}
.big{font-size:22px;font-weight:700}
.empty{color:var(--mut);text-align:center;padding:16px 0;font-size:14px}
</style>
</head>
<body>
<header>
  <h1>🧺 Mi Mercado <small id="per"></small></h1>
  <div class="bud">
    <div><b id="hB"></b><span>Presupuesto</span></div>
    <div><b id="hS"></b><span>Gastado</span></div>
    <div><b id="hR"></b><span>Disponible</span></div>
  </div>
  <div class="bar"><i id="hBar"></i></div>
</header>
<main id="main"></main>
<nav id="nav">
  <button data-t="lista"><span>🛒</span>Mercado</button>
  <button data-t="gastos"><span>🧾</span>Gastos</button>
  <button data-t="precios"><span>🏷️</span>Precios</button>
  <button data-t="listas"><span>📚</span>Listas</button>
  <button data-t="cerebro"><span>🧠</span>Cerebro</button>
</nav>
<datalist id="prodlist"></datalist>

<dialog id="dlg"><div class="in" id="dlgIn"></div></dialog>
<div id="toast"></div>

<script>
// ===== Utilidades =====
const KEY='mimercado.v1';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Math.round(n||0).toLocaleString('es-CO');
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
const fdate=s=>new Date(s+'T12:00:00').toLocaleDateString('es-CO',{day:'numeric',month:'short'});
const slug=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const num=v=>{const n=parseFloat(String(v).replace(/[^\d.,]/g,'').replace(/\./g,'').replace(',','.'));return isNaN(n)?0:n};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1900)}

const CATS={aseo:'🧼 Aseo y hogar',frescos:'🥬 Aliños y frescos',proteinas:'🍗 Proteínas',granos:'🍚 Granos y despensa',lacteos:'🥛 Lácteos y huevos',otros:'🛍️ Otros'};
const PRIO={1:'Esencial',2:'Importante',3:'Si alcanza'};

// ===== Datos iniciales (del Plan de Mercado) =====
function seed(){
  const P=(name,cat,min,max,prio,unit)=>({id:slug(name),name,cat,ref:{min,max:max||min},prio,unit:unit||'und'});
  const products=[
    P('Lavaplatos líquido','aseo',3500,4500,1),P('Esponjas para loza','aseo',1500,2000,1),
    P('Papel higiénico x4-6','aseo',6000,8000,1,'paq'),P('Jabón de cuerpo','aseo',3000,4500,1),
    P('Crema de dientes','aseo',4000,5500,1),P('Máquinas de afeitar','aseo',4000,7000,2,'paq'),
    P('Jarra para agua con tapa','aseo',6000,10000,2),P('Ambientador','aseo',4000,6000,3),
    P('Detergente ropa','aseo',7000,9500,2,'bolsa'),
    P('Cebolla larga y cabezona','frescos',4000,4000,1),P('Tomate maduro','frescos',4000,4000,1,'lb'),
    P('Ajo (cabeza o pasta)','frescos',2000,2000,1),P('Cilantro','frescos',1000,1000,2,'atado'),
    P('Plátanos','frescos',4000,4000,2),P('Aceite repuesto','granos',4500,4500,1,'bolsa'),
    P('Arroz','granos',4000,5000,1,'lb'),P('Lentejas','granos',3500,4500,2,'lb'),
    P('Fríjol','granos',5500,7000,3,'lb'),P('Pasta / espagueti','granos',2500,3500,2,'paq'),
    P('Avena en hojuelas','granos',3500,5000,2,'bolsa'),P('Panela','granos',2000,3000,2),
    P('Azúcar','granos',2800,3500,3,'lb'),P('Café','granos',8000,12000,3,'paq'),
    P('Atún en lata','proteinas',5000,6500,3,'lata'),
    P('Pollo (pechuga o muslos)','proteinas',18000,24000,2,'bandeja'),P('Queso / cuajada','lacteos',6000,8000,3),
    P('Arepas','granos',3000,4500,2,'paq'),P('Huevos x30','lacteos',15000,19000,2,'panal'),
    P('Leche bolsa','lacteos',4000,5000,2,'bolsa')
  ];
  const plan=['lavaplatos-liquido','esponjas-para-loza','papel-higienico-x4-6','jabon-de-cuerpo','crema-de-dientes','maquinas-de-afeitar','jarra-para-agua-con-tapa','ambientador','cebolla-larga-y-cabezona','tomate-maduro','ajo-cabeza-o-pasta','cilantro','aceite-repuesto','arroz','pollo-pechuga-o-muslos','queso-cuajada','arepas','platanos'];
  const tplPlan={id:'plan-nov',name:'Lista básica de quincena',items:plan.map(p=>({pid:p,qty:1}))};
  const tplAseo={id:'aseo',name:'Solo aseo urgente',items:plan.slice(0,6).map(p=>({pid:p,qty:1}))};
  return {version:1,
    onboarded:false,settings:{budget:0,paydays:[15,30],start:today(),end:addDays(today(),14),reserve:30,store:'D1',stores:['D1','Ara','Olímpica','Tienda del barrio','Galería/Plaza','Otra'],basket:'plan-nov'},
    products,
    list:[],trips:[],asked:{},
    purchases:[],prices:[],
    templates:[tplPlan,tplAseo],
    pantry:[]
  };
}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.version)return s}catch(e){}return seed()}
function migrate(S){
  if(S.onboarded===undefined)S.onboarded=true;
  S.asked=S.asked||{};S.settings.paydays=S.settings.paydays||[15,30];
  if(!S.trips){S.trips=[];if(S.list.some(i=>i.done)){const d=S.purchases.map(p=>p.date).sort()[0]||today();S.trip={id:uid(),store:S.settings.store,date:d,start:Date.now()}}}
  if(!S.settings.stores.some(x=>/barrio/i.test(x)))S.settings.stores.splice(Math.max(0,S.settings.stores.indexOf('Otra')),0,'Tienda del barrio');
  S.pantry.forEach(pParse);S.usage=S.usage||[];
  return S}
let S=migrate(load());
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));if(typeof idb!=='undefined')syncMeta()}catch(e){toast('⚠️ No se pudo guardar')}}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});

// ===== Lógica de precios =====
const prod=id=>S.products.find(p=>p.id===id);
const pname=id=>prod(id)?.name||id;
const obsOf=(pid,store)=>S.prices.filter(o=>o.pid===pid&&(!store||o.store===store)).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(b.ts||0)-(a.ts||0));
const latest=(pid,store)=>obsOf(pid,store)[0];
function est(pid){const o=latest(pid,S.settings.store)||latest(pid);if(o)return o.price;const p=prod(pid);return p?Math.round((p.ref.min+p.ref.max)/2):0}
const estSrc=pid=>latest(pid,S.settings.store)?'obs':latest(pid)?'otra':'ref';
const byName=n=>{const k=slug(n||'');return k?(S.products.find(p=>slug(p.name)===k)||prod(k)):null};
function ensureProduct(name,cat){const f=byName(name);if(f)return f.id;let id=slug(name);if(!id)return null;if(prod(id))id+='-'+uid().slice(0,3);if(!prod(id))S.products.push({id,name:name.trim(),cat:cat||'otros',ref:{min:0,max:0},prio:2,unit:'und'});return id}
function inPeriod(d){return d>=S.settings.start&&d<=S.settings.end}
function spent(){return S.purchases.filter(p=>inPeriod(p.date)).reduce((a,p)=>a+p.total,0)}
function pending(){return S.list.filter(i=>!i.done).reduce((a,i)=>a+est(i.pid)*i.qty,0)}
function storeLinks(name){const q=encodeURIComponent(name);return `<div class="links">
<a target="_blank" rel="noopener" href="https://www.google.com/search?q=${q}+precio+tiendas+D1+Colombia">D1</a>
<a target="_blank" rel="noopener" href="https://www.google.com/search?q=${q}+precio+tiendas+Ara+Colombia">Ara</a>
<a target="_blank" rel="noopener" href="https://www.olimpica.com/${q}?_q=${q}&map=ft">Olímpica</a>
<a target="_blank" rel="noopener" href="https://www.google.com/search?q=${q}+precio+Colombia&tbm=shop">Comparar</a></div>`}

// ===== Header =====
function renderHeader(){
  const st=S.settings,sp=spent(),rem=st.budget-sp;
  $('#hB').textContent=money(st.budget);$('#hS').textContent=money(sp);$('#hR').textContent=money(rem);
  $('#hBar').style.width=Math.min(100,sp/st.budget*100)+'%';
  const dl=Math.max(0,daysBetween(today(),st.end)+1);
  $('#per').textContent=`hasta ${fdate(st.end)} · ${dl} días`;
  $('#prodlist').innerHTML=S.products.map(p=>`<option value="${esc(p.name)}">`).join('');
}

// ===== Tabs =====
let tab='lista';
const R={lista,gastos,precios,listas,cerebro};
function go(t){tab=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));render();scrollTo(0,0)}
function render(){save();renderHeader();$('#main').innerHTML=R[tab]()}
document.getElementById('nav').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.t)};

// ----- LISTA -----
function lista(){return S.trip?tripView():home()}
function tripView(){
  const pend=S.list.filter(i=>!i.done),done=S.list.filter(i=>i.done);
  const pe=pending(),rem=S.settings.budget-spent();
  const byCat={};pend.forEach(i=>{const c=prod(i.pid)?.cat||'otros';(byCat[c]=byCat[c]||[]).push(i)});
  const tt=tripPurchases().reduce((a,x)=>a+x.total,0);
  let h=`<div class="card" style="border-color:var(--pri)"><h2>🛒 Mercado en curso <span class="mut" style="font-weight:400">${fdate(S.trip.date)} · ${money(tt)}</span></h2>
    ${S.trip.budget?`<div class="row" style="justify-content:space-between;font-size:13px"><span class="mut">Presupuesto ${money(S.trip.budget)}</span><b style="color:${tt+pe>S.trip.budget?'var(--bad)':'var(--ok)'}">${tt>S.trip.budget?'Te pasaste '+money(tt-S.trip.budget):'Quedan '+money(S.trip.budget-tt)}</b></div><div class="hb" style="margin-bottom:8px"><i style="width:${Math.min(100,tt/S.trip.budget*100)}%;${tt>S.trip.budget?'background:var(--bad)':''}"></i></div>`:''}
    <div class="row"><span class="mut" style="white-space:nowrap">🏪 Comprando en</span>
    <select onchange="S.settings.store=S.trip.store=this.value;render()">${S.settings.stores.map(s=>`<option ${s===S.settings.store?'selected':''}>${esc(s)}</option>`).join('')}</select></div>
    <div class="row" style="margin-top:8px"><button style="flex:1" onclick="openScan()">📷 Escanear código</button><button style="flex:1" onclick="openReceipt()">🧾 Importar factura</button></div>
    <button class="p" style="width:100%;margin-top:8px" onclick="finishTrip()">✅ Finalizar mercado</button></div>
  <div class="card"><form class="row" onsubmit="addToList(event)">
    <input name="n" list="prodlist" placeholder="Agregar producto…" autocomplete="off" required>
    <input name="q" type="number" min="0.1" step="any" value="1" style="width:62px">
    <button class="p">＋</button></form>
    <div class="row" style="justify-content:space-between;margin-top:10px">
      <div><div class="mut">Falta por comprar (estimado)</div><div class="big">${money(pe)}</div></div>
      <div style="text-align:right"><div class="mut">Te quedaría</div><div class="big" style="color:${rem-pe<0?'var(--bad)':'var(--ok)'}">${money(rem-pe)}</div></div>
    </div></div>`;
  h+=`<div class="card"><h2>Por comprar <span class="mut">${pend.length} ítems</span></h2>`;
  if(!pend.length)h+=`<div class="empty">Lista vacía. Carga una lista en 📚 Listas.</div>`;
  for(const c of Object.keys(CATS))if(byCat[c]){
    h+=`<div class="cat">${CATS[c]}</div>`;
    byCat[c].sort((a,b)=>(prod(a.pid)?.prio||2)-(prod(b.pid)?.prio||2)).forEach(i=>{const p=prod(i.pid),src=estSrc(i.pid);
      h+=`<div class="it"><button class="ck" onclick="buy('${i.id}')" aria-label="Comprado"></button>
      <div class="n" onclick="editListItem('${i.id}')"><b>${esc(pname(i.pid))}</b><small>${i.qty} ${esc(p?.unit||'')} · ${PRIO[p?.prio||2]}${src==='ref'?' · precio ref.':''}</small></div>
      <span class="price">${money(est(i.pid)*i.qty)}</span></div>`})
  }
  h+=`</div>`;
  if(done.length){h+=`<div class="card"><details><summary>Comprados (${done.length})</summary>`;
    done.forEach(i=>{h+=`<div class="it done"><button class="ck" onclick="undo('${i.id}')">✓</button><div class="n"><b>${esc(pname(i.pid))}</b><small>${i.qty} · pagado ${money(i.paid||0)}</small></div></div>`});
    h+=`<div class="acts"><button class="sm" onclick="clearDone()">Quitar comprados de la lista</button></div></details></div>`}
  h+=`<div class="card"><div class="acts" style="margin:0;justify-content:space-between">
    <button onclick="saveAsTemplate()">💾 Guardar como lista</button><button class="g sm" onclick="clearList()">🗑 Vaciar lista</button></div></div>`;
  h+=`<div class="card"><details><summary>🏠 Despensa actual (${S.pantry.length})</summary>
    <p class="mut">Lo que ya tienes en casa. El Cerebro lo usa para sugerirte comidas y no repetir compras.</p>`;
  S.pantry.forEach(x=>{h+=`<div class="it"><div class="n"><b>${esc(x.name)}</b><small>${esc(pInfo(x))}</small></div><button class="g" onclick="delPantry('${x.id}')">✕</button></div>`});
  h+=`<form class="row" style="margin-top:8px" onsubmit="addPantry(event)"><input name="n" placeholder="Producto" required><input name="q" placeholder="Cant." style="width:90px"><button>＋</button></form></details></div>`;
  return h;
}
// ----- INICIO (sin mercado en curso) -----
const tripPurchases=()=>S.trip?S.purchases.filter(p=>!p.trip&&p.date>=S.trip.date):[];
function home(){
  const pend=S.list.filter(i=>!i.done),pe=pending(),rem=S.settings.budget-spent(),last=S.trips[0],qk=qKey(),ask=!S.asked[qk]&&!S.trips.some(t=>t.date>=qk)&&daysBetween(qk,today())<=6;
  let h=`${installEvt?`<div class="card row" style="justify-content:space-between"><span>📲 Instala Mi Mercado como app</span><button class="p sm" onclick="doInstall()">Instalar</button></div>`:''}
  ${backupDue()?`<div class="card" style="border-color:var(--warn);background:var(--warn2)"><b>💾 ${backupDue()<0?'Aún no tienes copia de seguridad':`Hace ${backupDue()} días no guardas copia`}</b>
    <p class="mut" style="margin:4px 0 8px">Si se daña o pierdes el teléfono, la copia te devuelve todo. Guárdala en Drive o envíatela por WhatsApp.</p>
    <div class="row"><button class="p" style="flex:1" onclick="shareBackup()">Guardar copia ahora</button><button class="g" onclick="S.backupSnooze=Date.now()+3*864e5;render()">Luego</button></div></div>`:''}

function qKey(d){d=d||today();const pd=(S.settings.paydays||[15,30]).slice().sort((a,b)=>a-b),[y,m]=d.split('-').map(Number);
  const mk=(yy,mm,dd)=>{const last=new Date(yy,mm,0).getDate();return `${yy}-${String(mm).padStart(2,'0')}-${String(Math.min(dd,last)).padStart(2,'0')}`};
  const c=[...pd.map(x=>mk(y,m,x)),...pd.map(x=>m===1?mk(y-1,12,x):mk(y,m-1,x))].filter(x=>x<=d).sort();return c[c.length-1]}
function suggestBudget(){const rem=Math.max(0,S.settings.budget-spent()),pe=pending(),tr=S.trips.slice(0,4),r5=v=>Math.ceil(v/5000)*5000,f5=v=>Math.floor(v/5000)*5000;

  const v=rem?Math.min(r5(pe*1.15),f5(rem)||rem):r5(pe*1.15);return{v,why:`Pendientes ~${money(pe)} + 15% de margen. Cuando tengas 2-3 mercados lo calculo con tu promedio real.`}}
function brainSuggest(){const out=[],seen=new Set(S.list.filter(i=>!i.done).map(i=>i.pid)),inPantry=pid=>!!pantryMatch(prod(pid)),n=S.trips.length;
  const add=(pid,qty,why)=>{const p=prod(pid);if(!p||p.cat==='otros'||seen.has(pid))return;seen.add(pid);out.push({pid,qty,why})};
  // 0) se está acabando en la despensa
  S.pantry.filter(pLow).forEach(x=>{const pid=x.pid&&prod(x.pid)?x.pid:ensureProduct(x.name);if(!pid||seen.has(pid))return;seen.add(pid);x.pid=pid;out.push({pid,qty:lastBuy(pid)?.qty||1,why:x.n!=null?`Quedan ${x.n} en la despensa`:'Queda poco en la despensa'})});
  // 1) ritmo de consumo
  S.products.forEach(p=>{const ds=[...new Set(S.purchases.filter(x=>x.pid===p.id).map(x=>x.date))].sort();if(ds.length<2)return;
    const gap=daysBetween(ds[0],ds[ds.length-1])/(ds.length-1);if(gap>=3&&daysBetween(today(),addDays(ds[ds.length-1],Math.round(gap)))<=4)add(p.id,lastBuy(p.id)?.qty||1,`Lo compras cada ~${Math.round(gap)} días`)});

  const cnt={};S.trips.forEach(t=>t.items.forEach(i=>{cnt[i.pid]=cnt[i.pid]||{c:0,q:i.qty};cnt[i.pid].c++}));
  Object.entries(cnt).sort((a,b)=>b[1].c-a[1].c).forEach(([pid,v])=>{if(!inPantry(pid))add(pid,v.q,`Ya no está en tu despensa · lo llevas en ${v.c} de ${n} mercado${n>1?'s':''}`)});
  return out}

function pParse(x){if(x.n!==undefined||x.lvl!==undefined){x.n=x.n??null;x.lvl=x.lvl||3;return x}

  else if((m=q.match(/^(\d+)\s+de\s/))&&+m[1]>=2){x.n=+m[1];x.u='und'}

// ----- Presentación y precio por unidad -----
function parseSize(t){t=String(t||'').toLowerCase().replace(',','.');let m=t.match(/([\d.]+)\s*(kg|g|gr|l|lt|ml|cc)\b/);
  if(m){let q=parseFloat(m[1]),u=m[2];if(u==='kg'){q*=1000;u='g'}if(u==='gr')u='g';if(u==='l'||u==='lt'){q*=1000;u='ml'}if(u==='cc')u='ml';return q?{q,u}:null}
  m=t.match(/x\s*(\d+)/);if(m)return{q:+m[1],u:'und'};return null}
function unitPrice(price,size){const z=parseSize(size);if(!z||!price)return'';
  if(z.u==='und')return money(price/z.q)+' c/u';const per=z.u==='g'?(z.q>=500?1000:100):(z.q>=500?1000:100);
  return money(price/z.q*per)+' por '+(per===1000?(z.u==='g'?'kg':'litro'):(z.u==='g'?'100 g':'100 ml'))}

  const byC={},byS={};ps.forEach(p=>{const c=prod(p.pid)?.cat||'otros';byC[c]=(byC[c]||0)+p.total;byS[p.store]=(byS[p.store]||0)+p.total});
  let h=`<div class="card"><h2>Este periodo <span class="price">${money(tot)}</span></h2>

    Object.entries(byC).sort((a,b)=>b[1]-a[1]).forEach(([c,v])=>{h+=`<div style="margin:6px 0"><div class="row" style="justify-content:space-between"><span>${CATS[c]}</span><span class="price">${money(v)} · ${Math.round(v/tot*100)}%</span></div><div class="hb"><i style="width:${v/tot*100}%"></i></div></div>`});

let gen=null;
function tplTotal(t){return t.items.reduce((a,i)=>a+est(i.pid)*i.qty,0)}
function listas(){
  const rem=Math.max(0,S.settings.budget-spent());
  let h=`<div class="card"><h2>✨ Lista sugerida por presupuesto</h2>
  <p class="mut" style="margin-top:0">Arma una lista empezando por lo esencial, con tus últimos precios vistos, y deja una reserva.</p>
  <div class="grid2"><div><label>¿Cuánto quieres gastar?</label><input id="gB" inputmode="numeric" value="${gen?gen.budget:Math.round(rem)}"></div>
  <div><label>Guardar de reserva</label><select id="gR">${[0,10,20,30,40].map(n=>`<option value="${n}" ${n==S.settings.reserve?'selected':''}>${n}%</option>`).join('')}</select></div></div>
  <div class="row" style="margin-top:8px;flex-wrap:wrap">${[50000,100000,150000].map(v=>`<button class="sm" onclick="$('#gB').value=${v};genList()">${money(v)}</button>`).join('')}
  <button class="p" style="flex:1" onclick="genList()">Generar</button></div>`;
  if(gen){h+=`<div style="margin-top:12px">`;
    gen.items.forEach(i=>{h+=`<div class="it"><div class="n"><b>${esc(pname(i.pid))}</b><small>${i.qty} · ${PRIO[prod(i.pid).prio]}</small></div><span class="price">${money(est(i.pid)*i.qty)}</span></div>`});
    h+=`<p class="row" style="justify-content:space-between"><span>Total <b>${money(gen.total)}</b></span><span class="mut">Reserva ${money(gen.budget-gen.total)}</span></p>
    ${gen.skipped.length?`<p class="mut">No alcanzó: ${gen.skipped.map(esc).join(', ')}</p>`:''}
    <div class="acts"><button onclick="saveGen()">💾 Guardar</button><button class="p" onclick="useGen()">Usar como lista</button></div></div>`}
  h+=`</div><div class="card"><h2>📚 Mis listas guardadas</h2>`;
  if(!S.templates.length)h+=`<div class="empty">No hay listas guardadas.</div>`;
  S.templates.forEach(t=>{h+=`<div class="it"><div class="n"><b>${esc(t.name)}${S.settings.basket===t.id?' <span class="chip">canasta base</span>':''}</b><small>${t.items.length} productos · aprox. ${money(tplTotal(t))}</small></div>
    <button class="sm" onclick="loadTpl('${t.id}')">Cargar</button><button class="g" onclick="tplMenu('${t.id}')">⋯</button></div>`});
  return h+`</div>`;
}
function genList(){
  const budget=num($('#gB').value),res=+$('#gR').value,target=budget*(1-res/100);
  const has=n=>S.pantry.some(x=>slug(n).split('-').some(w=>w.length>3&&slug(x.name).includes(w)));
  const cand=S.products.filter(p=>est(p.id)>0).sort((a,b)=>a.prio-b.prio||est(a.id)-est(b.id));
  let total=0;const items=[],skipped=[];
  for(const p of cand){if(p.prio>1&&has(p.name))continue;const c=est(p.id);if(total+c<=target){items.push({pid:p.id,qty:1});total+=c}else if(p.prio<3)skipped.push(p.name)}
  gen={budget,total,items,skipped};S.settings.reserve=res;render()}
function useGen(){if(S.list.some(i=>!i.done)&&!confirm('¿Reemplazar tu lista actual?'))return;S.list=gen.items.map(i=>({id:uid(),pid:i.pid,qty:i.qty,done:false}));gen=null;go('lista');toast('Lista lista 😉')}
function saveGen(){const n=prompt('Nombre de la lista',`Lista ${money(gen.budget)}`);if(!n)return;S.templates.push({id:uid(),name:n,items:gen.items});render();toast('Guardada')}
function saveAsTemplate(){const items=S.list.map(i=>({pid:i.pid,qty:i.qty}));if(!items.length)return toast('La lista está vacía');const n=prompt('Nombre para esta lista','Mi lista '+fdate(today()));if(!n)return;S.templates.push({id:uid(),name:n,items});render();toast('Lista guardada')}
function loadTpl(id){const t=S.templates.find(x=>x.id===id);t.items.forEach(it=>{if(!prod(it.pid))return;const ex=S.list.find(i=>i.pid===it.pid&&!i.done);if(ex)ex.qty=Math.max(ex.qty,it.qty);else S.list.push({id:uid(),pid:it.pid,qty:it.qty,done:false})});go('lista');toast('Lista cargada')}
function tplMenu(id){const t=S.templates.find(x=>x.id===id);openDlg(`<h3>${esc(t.name)}</h3>${t.items.map(i=>`<div class="it"><div class="n"><b>${esc(pname(i.pid))}</b></div><span class="mut">${i.qty}</span><span class="price">${money(est(i.pid)*i.qty)}</span></div>`).join('')}
  <div class="acts"><button class="d" onclick="S.templates=S.templates.filter(x=>x.id!=='${id}');closeDlg();render()">Borrar</button>
  <button onclick="S.settings.basket='${id}';closeDlg();render();toast('Será tu canasta de referencia')">Usar como canasta base</button>
  <button class="p" onclick="closeDlg()">Cerrar</button></div>`)}

// ----- CEREBRO -----
const TIPS=[
 ['🥬','Frescos en la galería','Cebolla, tomate, cilantro y plátano suelen salir más baratos en la plaza o galería del barrio que en el supermercado. Compra solo lo de 4-5 días para que no se dañe.'],
 ['🍗','Pollo en porciones','Compra la bandeja, divídela en porciones de una comida y congélalas. Rinde más y no se pierde.'],
 ['⚖️','Compara por gramo','Un paquete más grande no siempre es más barato. Divide precio ÷ gramos antes de decidir.'],
 ['🏷️','Marcas propias','En D1 y Ara las marcas propias de aseo y granos suelen costar bastante menos que la marca conocida con calidad parecida.'],
 ['🧾','Nunca con hambre','Ve al mercado comido y con la lista; las compras por antojo son las que descuadran la quincena.'],
 ['🧅','Hogao de una vez','Haz hogao para 3-4 días y guárdalo en frasco en la nevera: te ahorra tiempo y gas.'],
 ['💧','El agua es primero','Una jarra con tapa y agua hervida o filtrada te ahorra comprar bebidas toda la quincena.']
];
function cerebro(){
  const st=S.settings,sp=spent(),rem=st.budget-sp,dl=Math.max(1,daysBetween(today(),st.end)+1),pe=pending(),resAmt=st.budget*st.reserve/100;
  const T=[];
  T.push(['📅','Ritmo de gasto',`Te quedan ${money(rem)} para ${dl} días: unos ${money(rem/dl)} por día.`]);
  if(sp+pe>st.budget)T.push(['🚨','La lista no cabe',`Lo pendiente (${money(pe)}) supera lo disponible. Quita productos “Si alcanza” o compra menos cantidad.`]);
  else if(sp+pe>st.budget-resAmt){const cut=S.list.filter(i=>!i.done&&prod(i.pid)?.prio===3).map(i=>pname(i.pid));T.push(['⚠️','Se come la reserva',`Si compras todo lo pendiente quedarías con ${money(rem-pe)}, menos que tu reserva de ${money(resAmt)}.${cut.length?' Puedes dejar para después: '+cut.join(', ')+'.':''}`])}
  else if(pe)T.push(['✅','Vas bien',`Con lo pendiente te sobrarían ${money(rem-pe)}. ¡Esa es la reserva para imprevistos!`]);
  // tiendas
  const wins={};let cmp=0;S.products.forEach(p=>{const os=st.stores.map(s=>latest(p.id,s)).filter(Boolean);if(os.length>1){cmp++;const b=os.reduce((a,o)=>o.price<a.price?o:a);wins[b.store]=(wins[b.store]||0)+1}});
  if(cmp){const w=Object.entries(wins).sort((a,b)=>b[1]-a[1])[0];T.push(['🏪','Tienda más barata',`${w[0]} fue la más barata en ${w[1]} de ${cmp} productos que has comparado.`])}
  else T.push(['🏪','Compara tiendas','Anota el precio de un mismo producto en D1, Ara u Olímpica (pestaña Precios) y aquí te diré cuál te conviene.']);
  // alzas
  const ups=[];S.products.forEach(p=>{const o=obsOf(p.id);if(o.length>1&&o[0].price>o[1].price*1.1)ups.push(`${p.name} (+${Math.round((o[0].price/o[1].price-1)*100)}%)`)});
  if(ups.length)T.push(['📈','Subieron de precio',ups.slice(0,5).join(', ')]);
  // canasta
  const bt=S.templates.find(t=>t.id===st.basket);
  if(bt){const now=tplTotal(bt),ref=bt.items.reduce((a,i)=>{const p=prod(i.pid);return a+(p?(p.ref.min+p.ref.max)/2*i.qty:0)},0);
    const per=st.stores.map(s=>{let tot=0,ok=0;bt.items.forEach(i=>{const o=latest(i.pid,s);if(o){tot+=o.price*i.qty;ok++}});return[s,tot,ok]}).filter(x=>x[2]);
    T.push(['🧺',`Tu canasta “${bt.name}”`,`Hoy cuesta aprox. ${money(now)} (con precios de referencia era ${money(ref)}; ${now>ref?'subió '+money(now-ref):'bajó '+money(ref-now)}).${per.length?' Por tienda: '+per.map(([s,t,ok])=>`${s} ${money(t)} (${ok}/${bt.items.length} prod.)`).join(' · '):''}`])}
  if(S.trips.length){const tr=S.trips.slice(0,4),avg=tr.reduce((a,t)=>a+t.total,0)/tr.length,ob=tr.filter(t=>t.budget&&t.total>t.budget).length;
    T.push(['💰','Tu mercado típico',`Promedias ${money(avg)} por mercado (${tr.length} registrado${tr.length>1?'s':''}).${ob?` Te pasaste del presupuesto en ${ob}.`:''}${S.trips.length<3?' Con 2-3 mercados más este número se vuelve tu presupuesto confiable.':''}`])}
  // ritmo de consumo: aprende cada cuánto compras algo
  const due=[];S.products.forEach(p=>{const ds=[...new Set(S.purchases.filter(x=>x.pid===p.id).map(x=>x.date))].sort();if(ds.length<2)return;
    const gap=daysBetween(ds[0],ds[ds.length-1])/(ds.length-1),next=addDays(ds[ds.length-1],Math.round(gap));if(gap>=3&&daysBetween(today(),next)<=4)due.push(`${p.name} (cada ~${Math.round(gap)} días)`)});
  if(due.length)T.push(['🔁','Pronto se te acaba',due.join(', ')]);
  const np=S.purchases.filter(x=>x.noPrice).length;if(np)T.push(['⚠️','Compras sin precio',`Tienes ${np} compra(s) sin precio. Importa la factura y se completan solas.`]);
  // menú
  const pan=S.pantry.map(x=>slug(x.name)).join(' '),has=w=>pan.includes(w),M=[];
  if(has('lenteja'))M.push('Lentejas guisadas con hogao, zanahoria y papa, con arroz');
  if(has('huevo'))M.push('Huevos pericos con arepa');
  if(has('pasta')||has('espagueti'))M.push('Pasta con tomate y ajo');
  if(has('avena'))M.push('Avena cocida con leche y panela');
  if(has('papa')&&has('huevo'))M.push('Tortilla de papa');
  if(M.length)T.push(['🍲','Cocina con lo que tienes',M.join(' · ')]);
  const tip=TIPS[new Date().getDate()%TIPS.length];T.push(tip);
  let h=`<div class="card"><h2>🧠 Lo que veo</h2>${T.map(([e,t,p])=>`<div class="tip"><div class="e">${e}</div><div><b>${esc(t)}</b><p>${esc(p)}</p></div></div>`).join('')}</div>`;
  h+=`<div class="card"><h2>🤖 Pregúntale al Cerebro</h2>
  ${aiKey()?`<textarea id="aq" rows="2" placeholder="Ej: ¿qué compro con lo que me queda hasta el 15?"></textarea><div class="acts" style="margin-top:8px"><button class="p" onclick="askAI()">Preguntar</button></div><div id="aa" style="white-space:pre-wrap;font-size:14px"></div>`
  :`<p class="mut" style="margin-top:0">Para preguntarle aquí y leer fotos de facturas, agrega tu clave de la API de Claude abajo. Sin clave, copia tu contexto y pégalo en tu proyecto “Mercado Mensual”.</p>`}
  <div class="acts" style="justify-content:stretch"><button style="flex:1" onclick="copyCtx()">📋 Copiar contexto</button>${navigator.share?`<button onclick="shareCtx()">Compartir</button>`:''}</div>
  <details style="margin-top:8px"><summary>🔑 Clave de IA</summary><p class="mut">Se guarda solo en este teléfono y no va en las copias de seguridad. Créala en console.anthropic.com.</p>
  <input id="ak" type="password" value="${esc(aiKey())}" placeholder="sk-ant-…"><label>Modelo</label><input id="am" value="${esc(aiModel())}">
  <div class="acts"><button onclick="saveAI()">Guardar clave</button></div></details></div>`;
  h+=`<div class="card"><h2>⚙️ Ajustes del periodo</h2>
  <div class="grid2"><div><label>Presupuesto</label><input id="sB" inputmode="numeric" value="${st.budget}"></div><div><label>Reserva %</label><input id="sR" type="number" value="${st.reserve}"></div>
  <div><label>Desde</label><input id="sS" type="date" value="${st.start}"></div><div><label>Hasta</label><input id="sE" type="date" value="${st.end}"></div>
  <div><label>Tienda habitual</label><select id="sT">${st.stores.map(s=>`<option ${s===st.store?'selected':''}>${esc(s)}</option>`).join('')}</select></div>
  <div><label>Tiendas (separadas por coma)</label><input id="sL" value="${esc(st.stores.join(', '))}"></div>
  <div><label>Días de pago / quincena</label><input id="sD" value="${esc((st.paydays||[15,30]).join(', '))}"></div>
  <div><label>Avisos</label><button type="button" style="width:100%" onclick="enableNotif()">${typeof Notification!=='undefined'&&Notification.permission==='granted'?'🔔 Activados':'🔔 Activar avisos'}</button></div></div>
  <div class="acts"><button class="g" onclick="tour(0)">📘 Tutorial</button><button onclick="newPeriod()">🔄 Nueva quincena</button><button class="p" onclick="saveSettings()">Guardar</button></div></div>`;
  h+=`<div class="card"><h2>🗂️ Historial y archivos</h2><p class="mut" style="margin-top:0">Copias automáticas (una por día y antes de cada cambio grande) y las fotos de tus facturas. Puedes volver a cualquier punto.</p>
  <div class="acts" style="justify-content:flex-start"><button class="p" onclick="openHistory()">Abrir historial</button><button onclick="snapshot('Punto guardado a mano').then(()=>toast('Punto guardado ✓'))">📌 Guardar punto</button></div></div>`;
  h+=`<div class="card"><h2>💾 Copia de seguridad</h2><p class="mut" style="margin-top:0">Todo vive solo en este dispositivo. ${S.lastBackup?'Última copia: '+new Date(S.lastBackup).toLocaleDateString('es-CO',{day:'numeric',month:'short'})+'.':'Aún no has guardado ninguna copia.'} Te recordaré cada 15 días.</p>
  <div class="acts" style="justify-content:flex-start"><button onclick="shareBackup()">Guardar en Drive / WhatsApp</button><button onclick="exportData();render()">Descargar copia</button><button onclick="$('#imp').click()">Restaurar copia</button><button class="d" onclick="resetAll()">Borrar todo</button></div>
  <input id="imp" type="file" accept=".json,application/json" hidden onchange="importData(this.files[0])"></div>`;
  return h;
}
function saveSettings(){const st=S.settings;st.paydays=$('#sD').value.split(',').map(x=>parseInt(x)).filter(x=>x>=1&&x<=31);if(!st.paydays.length)st.paydays=[15,30];st.budget=num($('#sB').value)||st.budget;st.reserve=+$('#sR').value||0;st.start=$('#sS').value;st.end=$('#sE').value;
  st.stores=$('#sL').value.split(',').map(s=>s.trim()).filter(Boolean);st.store=st.stores.includes($('#sT').value)?$('#sT').value:st.stores[0];render();toast('Ajustes guardados')}

function ctxText(){const st=S.settings,sp=spent();
  const lines=[`Soy de Pereira, Colombia. Gestiono mi mercado con este contexto (moneda COP):`,

  `\nLista pendiente:`,...S.list.filter(i=>!i.done).map(i=>`- ${pname(i.pid)} x${i.qty} (aprox. ${money(est(i.pid)*i.qty)})`),
  `\nCompras del periodo:`,...S.purchases.filter(p=>inPeriod(p.date)).map(p=>`- ${p.date} ${pname(p.pid)} x${p.qty} a ${money(p.price)} en ${p.store}`),
  `\nÚltimos precios vistos:`,...S.products.filter(p=>obsOf(p.id).length).map(p=>`- ${p.name}: `+st.stores.map(s=>{const o=latest(p.id,s);return o?`${s} ${money(o.price)} (${o.date})`:null}).filter(Boolean).join(', ')),
  `\nDespensa: ${S.pantry.map(x=>`${x.name} (${x.n!=null?x.n+' '+(x.u||'und'):LV[x.lvl].slice(4)})`).join(', ')}`,

function copyCtx(){navigator.clipboard.writeText(ctxText()).then(()=>toast('Contexto copiado ✓'),()=>{openDlg(`<h3>Copia este texto</h3><textarea rows="12">${esc(ctxText())}</textarea><div class="acts"><button class="p" onclick="closeDlg()">Cerrar</button></div>`)})}
function shareCtx(){navigator.share({title:'Mi mercado',text:ctxText()}).catch(()=>{})}
function backupDue(){const has=S.trips.length||S.purchases.length;if(!has||S.trip)return 0;const now=Date.now();if(S.backupSnooze&&now<S.backupSnooze)return 0;
  if(!S.lastBackup)return -1;const d=Math.floor((now-S.lastBackup)/864e5);return d>=15?d:0}
async function shareBackup(){const f=new File([JSON.stringify(S,null,1)],`mi-mercado-${today()}.json`,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'Copia Mi Mercado'});S.lastBackup=Date.now();S.backupSnooze=0;render();toast('Copia guardada ✓')}catch(e){}}else{exportData();render();toast('Copia descargada ✓')}}
function exportData(){S.lastBackup=Date.now();S.backupSnooze=0;save();const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`mi-mercado-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function importData(f){if(!f)return;snapshot('Antes de restaurar copia');f.text().then(t=>{const d=JSON.parse(t);if(!d.version||!d.products)throw 0;S=migrate(d);S.onboarded=true;render();toast('Copia restaurada')}).catch(()=>toast('Archivo no válido'))}
function resetAll(){if(confirm('¿Borrar TODOS los datos y volver al inicio?')){snapshot('Antes de borrar todo');S=seed();render()}}

async function callAI(content,max=3000){

function parseReceipt(t){const items=[];let total=0;
  t.split(/\n/).forEach(l=>{l=l.trim();
    const m=l.match(/([0-9A-Za-z€?]{11,14})\s+(.+?)\s+(\d{1,3})\s*U[NM]?\S*\s+([\d.,]{3,})\s+([\d.,]{3,})\s*\S{0,2}$/);
    if(m){let code=fixCode(m[1]),qty=+m[3],u=num(m[4]),tt=num(m[5]),warn='';
      if(qty*u!==tt){if(u&&tt%u===0&&tt/u<=50)qty=tt/u;else warn='Revisa cantidad y precio'}
      items.push({code,desc:m[2].replace(/\s+[A-Z]$/,'').trim(),qty,price:u,warn})}
    const tm=[...l.matchAll(/total\s*:?\s*\$?\s*([\d.,]{4,})/ig)];tm.forEach(x=>{const v=num(x[1]);if(v>1000)total=v})});

const idb=(()=>{let db;const open=()=>db?Promise.resolve(db):new Promise((ok,ko)=>{const r=indexedDB.open('mimercado',2);
  r.onupgradeneeded=()=>{const d=r.result;for(const n of ['snaps','files','meta'])if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'})};r.onsuccess=()=>{db=r.result;ok(db)};r.onerror=()=>ko(r.error)});
  const tx=(st,mode,fn)=>open().then(d=>new Promise((ok,ko)=>{const t=d.transaction(st,mode),q=fn(t.objectStore(st));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>ko(t.error)}));
  return{put:(st,v)=>tx(st,'readwrite',o=>o.put(v)),all:st=>tx(st,'readonly',o=>o.getAll()),get:(st,k)=>tx(st,'readonly',o=>o.get(k)),del:(st,k)=>tx(st,'readwrite',o=>o.delete(k))}})();

    <div class="row" style="flex-wrap:wrap;gap:6px">${st.stores.map(x=>`<button class="${x===st.store?'p':''}" onclick="S.settings.store='${esc(x)}';wizard(2)">${esc(x)}</button>`).join('')}</div>
    <div class="acts"><button class="g" onclick="wizard(1)">Atrás</button><button class="p" onclick="wizard(3)">Siguiente</button></div>${dots}`);
  if(step===3){const common=['Arroz','Huevos','Aceite','Sal','Azúcar','Panela','Leche','Café','Pasta','Lentejas','Fríjol','Avena','Papas','Cebolla','Tomate','Ajo','Papel higiénico','Jabón','Crema dental','Lavaloza'];W.sel=W.sel||new Set();
    return openDlg(`<h3>🏠 ¿Qué tienes en casa?</h3><p class="mut" style="margin-top:0">Toca lo que ya tienes. Lo que falte lo puedes anotar como pendiente. (Opcional)</p>
    <div class="row" style="flex-wrap:wrap;gap:6px">${common.map(x=>`<button class="sm ${W.sel.has(x)?'p':''}" onclick="W.sel.has('${x}')?W.sel.delete('${x}'):W.sel.add('${x}');wizard(3)">${x}</button>`).join('')}</div>
    <div class="acts"><button class="g" onclick="wizard(2)">Atrás</button><button class="p" onclick="wFinish()">Terminar</button></div>${dots}`)}
}
function wSave1(){const st=S.settings,b=num($('#wB').value);if(!b)return toast('Escribe tu presupuesto');st.budget=b;st.reserve=+$('#wR').value;
  st.paydays=$('#wD').value.split(',').map(x=>parseInt(x)).filter(x=>x>=1&&x<=31);if(!st.paydays.length)st.paydays=[15,30];st.start=today();st.end=nextPayday(st.paydays);wizard(2)}
function wFinish(){(W.sel||new Set()).forEach(n=>{if(!S.pantry.some(x=>slug(x.name)===slug(n)))S.pantry.push({id:uid(),name:n,qty:'',n:null,lvl:3,upd:today()})});
  S.onboarded=true;S.asked[qKey()]='inicio';render();tour(0)}
const TOUR=[
 ['🛒','Inicio','Aquí siempre está el botón Iniciar mercado, lo que te falta comprar y tu despensa. Anota lo que se vaya acabando en “Pendiente por comprar”.'],
 ['✅','Mientras compras','Toca el cuadrito de cada producto al echarlo al carrito y escribe el precio. Si no lo ves, déjalo vacío. Con 📷 escaneas el código de barras.'],
 ['🧾','Al llegar a casa','Usa “Importar factura” con una foto del recibo: registra todo de una vez y revisa que cuadre con el total. Luego toca “Finalizar mercado” y tu despensa se actualiza sola.'],
 ['🧠','El Cerebro','Aprende de tus mercados: te dice cuánto puedes gastar por día, qué tienda es más barata, qué se te va a acabar y te sugiere qué comprar.'],
 ['💾','Tus datos','Viven solo en este teléfono. En Cerebro → Copia de seguridad descarga una copia de vez en cuando. Si cambias de teléfono, la restauras y sigues igual.']];
function tour(i){const [e,t,x]=TOUR[i];openDlg(`<div style="text-align:center;font-size:44px">${e}</div><h3 style="text-align:center">${t}</h3><p style="text-align:center">${x}</p>
  <p class="mut" style="text-align:center">${i+1} de ${TOUR.length}</p>
  <div class="acts">${i?`<button class="g" onclick="tour(${i-1})">Atrás</button>`:`<button class="g" onclick="closeDlg()">Saltar</button>`}<button class="p" onclick="${i<TOUR.length-1?`tour(${i+1})`:'closeDlg();toast(\'¡Listo para tu primer mercado!\')'}">${i<TOUR.length-1?'Siguiente':'¡Empezar!'}</button></div>`)}

// ===== Diálogo =====
function openDlg(h){$('#dlgIn').innerHTML=h;const d=$('#dlg');if(!d.open)d.showModal()}
function closeDlg(){$('#dlg').close()}
$('#dlg').addEventListener('click',e=>{if(e.target.id==='dlg')closeDlg()});

go('lista');handleParams();if(!S.onboarded)setTimeout(()=>wizard(0),400);
loadFiles().then(autoSnap);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
