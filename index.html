<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi Mercado</title>
<meta name="theme-color" content="#ECE3CC" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#1D1913" media="(prefers-color-scheme: dark)">
<meta name="description" content="Lista de compras, registro de precios y presupuesto de mercado">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preload" href="fonts/kalam-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:Kalam;font-weight:400;font-display:swap;src:url(fonts/kalam-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Kalam;font-weight:700;font-display:swap;src:url(fonts/kalam-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:Mano;font-weight:400;font-display:swap;src:url(fonts/courier-prime-latin-400-normal.woff2) format('woff2');unicode-range:U+0024,U+0030-0039}
@font-face{font-family:Mano;font-weight:700;font-display:swap;src:url(fonts/courier-prime-latin-700-normal.woff2) format('woff2');unicode-range:U+0024,U+0030-0039}
@font-face{font-family:Mano;font-weight:400;font-display:swap;src:url(fonts/kalam-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-0023,U+0025-002F,U+003A-FFFF}
@font-face{font-family:Mano;font-weight:700;font-display:swap;src:url(fonts/kalam-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-0023,U+0025-002F,U+003A-FFFF}
@font-face{font-family:'Courier Prime';font-weight:400;font-display:swap;src:url(fonts/courier-prime-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Courier Prime';font-weight:700;font-display:swap;src:url(fonts/courier-prime-latin-700-normal.woff2) format('woff2')}
:root{--bg:#ECE3CC;--card:#FBF7EC;--ink:#34261A;--mut:#8A7861;--line:rgba(52,38,26,.16);--rule:#C7D5E0;--margin:#DB8F86;
  --pri:#3E7B3A;--pri-d:#2C5A29;--pri2:#E1ECD3;--warn:#946512;--warn2:#F4E5C1;--bad:#B3392C;--bad2:#F6DED8;--ok:#3E7B3A;--paper:#FFFDF6;
  --hand:'Mano','Kalam','Segoe Print','Bradley Hand',cursive;--tick:'Courier Prime','Courier New',monospace}
@media (prefers-color-scheme:dark){:root{--bg:#1D1913;--card:#28221A;--ink:#EFE5D2;--mut:#AA9A82;--line:rgba(239,229,210,.14);--rule:#3B4048;--margin:#7E433D;
  --pri:#8DC67F;--pri-d:#5E9452;--pri2:#2E3A25;--warn:#E3B45C;--warn2:#3A2F1B;--bad:#F08C7E;--bad2:#3F2420;--ok:#8DC67F;--paper:#2E281F}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg) radial-gradient(rgba(52,38,26,.045) 1px,transparent 1.2px) 0 0/4px 4px;color:var(--ink);font:400 17px/1.4 var(--hand);
  padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom));min-height:100vh}
main{padding:10px 16px 24px;max-width:620px;margin:0 auto}
.pt{font-size:34px;font-weight:700;line-height:1.1;margin:10px 0 2px}
.pts{color:var(--mut);margin:0 0 14px;font-size:16px}
.pts select{display:inline-block;width:auto;padding:2px 8px;margin-left:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:3px 3px 6px 6px;padding:14px;margin:0 0 18px;
  box-shadow:0 3px 0 -1px var(--card),0 3px 0 0 var(--line),0 6px 0 -2px var(--card),0 6px 0 -1px var(--line)}
.card h2{font-size:23px;font-weight:700;line-height:1.15;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 .mut{font:400 14px var(--tick)}
.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}
input,select,button,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;font-size:17px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri)}
:focus-visible{outline:2.5px solid var(--pri);outline-offset:2px}
button{border:1.5px solid var(--line);border-radius:10px;padding:8px 13px;background:var(--card);color:var(--ink);font-weight:700;cursor:pointer;white-space:nowrap;font-size:16px;
  transition:transform .08s}
button:active{transform:translateY(2px)}
button.p{background:var(--pri);border-color:var(--pri-d);color:#FBF7EC;box-shadow:0 3px 0 var(--pri-d)}
button.p:active{box-shadow:0 1px 0 var(--pri-d)}
@media (prefers-color-scheme:dark){button.p{color:#16210F}}
button.g{background:transparent;border-color:transparent;color:var(--mut);padding:6px 8px}
button.d{background:var(--bad2);border-color:transparent;color:var(--bad)}
button.sm{padding:4px 10px;font-size:15px}
.it{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px dashed var(--line)}
.it:first-of-type{border-top:0}
.it .n{flex:1;min-width:0}.it .n b{font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis}
.it .n small,.mut{color:var(--mut);font-size:14.5px}
.it.done .n b{text-decoration:line-through;color:var(--mut)}
.ck{width:26px;height:26px;border-radius:6px 8px 6px 9px;border:2px solid var(--ink);flex:none;display:grid;place-items:center;background:none;padding:0;box-shadow:none}
.done .ck{background:var(--pri);border-color:var(--pri);color:#fff}
.cat{font-size:17px;font-weight:700;color:var(--mut);margin:12px 0 2px;text-decoration:underline wavy var(--rule) 1.5px;text-underline-offset:5px}
.chip{display:inline-block;font:700 12.5px var(--tick);padding:1px 7px;border-radius:4px;background:var(--pri2);color:var(--pri);margin:2px 4px 0 0}
.chip.w{background:var(--warn2);color:var(--warn)}.chip.b{background:var(--bad2);color:var(--bad)}
.price{font:700 16px var(--tick);white-space:nowrap;font-variant-numeric:tabular-nums}
.big{font:700 26px var(--tick);letter-spacing:-.5px}
label{display:block;font-size:15px;color:var(--mut);margin:10px 0 3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.tip{display:flex;gap:12px;padding:11px 0;border-top:1px dashed var(--line)}.tip:first-of-type{border-top:0}
.tip .e{font-size:24px;line-height:1.1}
.tip b{font-size:18px}.tip p{margin:2px 0 0;color:var(--mut);font-size:15.5px}
.hb{height:8px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:3px}.hb i{display:block;height:100%;background:var(--pri)}
table{width:100%;border-collapse:collapse;font:14px var(--tick)}td,th{padding:5px 4px;border-top:1px dashed var(--line);text-align:left}th{color:var(--mut);font-weight:700}
.links{display:flex;gap:6px;flex-wrap:wrap}.links a{text-decoration:none;font-size:15px;padding:4px 10px;border-radius:8px;border:1.5px solid var(--line);color:var(--ink);font-weight:700}
details summary{cursor:pointer;font-weight:700;color:var(--pri);padding:4px 0}
.empty{color:var(--mut);text-align:center;padding:14px 0;font-size:16px}
#toast{position:fixed;left:50%;bottom:calc(112px + env(safe-area-inset-bottom));transform:translateX(-50%) rotate(-1deg);background:var(--ink);color:var(--card);padding:9px 15px;border-radius:6px;font-size:16px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:90vw}
#toast.on{opacity:1}
.has-caja #toast{bottom:calc(186px + env(safe-area-inset-bottom))}

/* ---- Tiquete de la quincena ---- */
.tq{background:var(--paper);font:400 15px/1.5 var(--tick);padding:18px 18px 30px;margin:0 0 22px;color:var(--ink);
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/16px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/16px 100%;
  filter:drop-shadow(0 1px 0 var(--line))}
.tq .hd{text-align:center;color:var(--mut)}
.tq .hd b{display:block;color:var(--ink);font-size:17px;letter-spacing:2px}
.tq hr{border:0;border-top:2px dashed var(--line);margin:10px 0}
.tq .l{display:flex;gap:6px}.tq .l span:nth-child(2){flex:1;border-bottom:2px dotted var(--line);transform:translateY(-5px)}
.tq .tot{display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
.tq .tot .big{font-size:34px}
.tq .bar{font-size:14px;letter-spacing:1px;color:var(--pri);white-space:nowrap;overflow:hidden}
.tq .bar.over{color:var(--bad)}

/* ---- Hoja de cuaderno (lista) ---- */
.nb{--lh:46px;position:relative;background:linear-gradient(to right,transparent 38px,var(--margin) 38px 39.5px,transparent 39.5px),
  repeating-linear-gradient(to bottom,transparent 0 calc(var(--lh) - 1px),var(--rule) calc(var(--lh) - 1px) var(--lh)),var(--card);
  border:1px solid var(--line);border-radius:3px;margin:0 0 18px;padding:0 12px 0 0;overflow:hidden;
  box-shadow:0 3px 0 -1px var(--card),0 3px 0 0 var(--line)}
.nb-h{height:var(--lh);display:flex;align-items:center;justify-content:space-between;padding-left:48px;font-size:23px;font-weight:700}
.nb-h .mut{font:400 14px var(--tick)}
.nb-c{height:var(--lh);display:flex;align-items:flex-end;padding:0 8px 6px 48px;color:var(--mut);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln{position:relative;height:var(--lh);touch-action:pan-y}
.ln .sw{position:absolute;inset:0 0 1px;display:flex;align-items:center;gap:6px;padding-left:48px;background:var(--card);
  background:linear-gradient(to right,transparent 38px,var(--margin) 38px 39.5px,transparent 39.5px),var(--card);transition:transform .18s ease-out;will-change:transform}
.ln .bk{position:absolute;inset:0 0 1px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-weight:700;color:#FBF7EC}
.ln .bk.r{background:var(--pri)}.ln .bk.l{background:var(--bad)}
.ln .ck{position:absolute;left:7px;top:50%;margin-top:-13px}
.ln .n{flex:1;min-width:0;line-height:1.1;cursor:pointer}
.ln .n b{display:block;font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln .n small{display:block;color:var(--mut);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln .lead{flex:0 1 40px;min-width:10px;align-self:flex-end;margin-bottom:15px;border-bottom:2.5px dotted var(--mut);opacity:.45}
.ln.done .n b{color:var(--mut);background:linear-gradient(transparent 52%,var(--pri) 52% 60%,transparent 60%) no-repeat 0 0/100% 100%;width:max-content;max-width:100%}
.ln.skip .n b{color:var(--mut);text-decoration:line-through wavy var(--bad) 1.5px}
.sello{font:700 11px var(--tick);letter-spacing:.5px;color:var(--pri);border:2px solid currentColor;border-radius:4px;padding:0 5px;transform:rotate(-7deg);white-space:nowrap;opacity:.9}
.sello.b{color:var(--bad)}.sello.w{color:var(--warn)}
.ln-add{display:flex;align-items:center;height:var(--lh);padding-left:48px;gap:6px}
.ln-add input{border:0;background:transparent;padding:4px 0;font-size:18px;border-radius:0}
.ln-add input[type=number]{width:46px;text-align:center;font-family:var(--tick)}
.ln-add button{padding:2px 10px}
@media (prefers-reduced-motion:reduce){.ln .sw{transition:none}}

/* ---- Barra de caja (mercado en curso) ---- */
.caja{position:fixed;left:0;right:0;bottom:calc(98px + env(safe-area-inset-bottom));z-index:6;padding:0 10px}
.caja>div{max-width:600px;margin:0 auto;background:var(--paper);border:1.5px solid var(--ink);border-radius:10px;padding:8px 10px 8px 14px;display:flex;align-items:center;gap:10px;
  box-shadow:0 3px 0 var(--ink)}
.caja .t{flex:1;font:400 13px/1.25 var(--tick);color:var(--mut)}
.caja .t b{display:block;font-size:21px;color:var(--ink)}
.caja .t .over{color:var(--bad)}
.has-caja main{padding-bottom:110px}

/* ---- Pestañas de separador ---- */
.seg{display:flex;gap:4px;margin:0 0 -1px;padding-left:8px;position:relative;z-index:1}
.seg button{border-radius:10px 10px 0 0;border:1px solid var(--line);border-bottom:0;background:var(--bg);color:var(--mut);padding:6px 14px;box-shadow:none;font-size:17px}
.seg button.on{background:var(--card);color:var(--ink)}
.seg+.card,.seg+div>.card:first-child{border-top-left-radius:0}
.seg+.pts{margin-top:10px}

/* ---- Despensa ---- */
.pn{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed var(--line)}.pn:first-of-type{border-top:0}
.pn .n{flex:1;min-width:0;cursor:pointer}.pn .n b{display:block;font-size:18px;line-height:1.15}.pn .n small{color:var(--mut);font-size:14px}
.cnt{display:flex;align-items:center;border:1.5px solid var(--ink);border-radius:20px;overflow:hidden}
.cnt button{border:0;border-radius:0;background:none;width:38px;height:36px;padding:0;font-size:20px;box-shadow:none}
.cnt b{font:700 17px var(--tick);min-width:30px;text-align:center}
.lvl{display:flex;gap:3px;align-items:flex-end;height:30px;padding:0 6px;background:none;border:0;box-shadow:none}
.lvl i{width:12px;border:1.5px solid var(--ink);border-radius:2px;background:transparent}
.lvl i:nth-child(1){height:12px}.lvl i:nth-child(2){height:20px}.lvl i:nth-child(3){height:28px}
.lvl i.f{background:var(--pri);border-color:var(--pri-d)}
.lvl.l1 i.f{background:var(--bad);border-color:var(--bad)}.lvl.l2 i.f{background:var(--warn);border-color:var(--warn)}
.lvl span{font-size:13px;color:var(--mut);margin-left:4px;align-self:center}

/* ---- Navegación ---- */
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1.5px solid var(--line);display:flex;align-items:flex-end;padding:0 4px env(safe-area-inset-bottom);z-index:7;height:calc(66px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;box-shadow:none;color:var(--mut);border-radius:0;padding:8px 0 9px;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:1px;height:66px;justify-content:flex-end}
nav button svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ink)}nav button.on svg{stroke-width:2.3}
nav button.on span{text-decoration:underline var(--pri) 2.5px;text-underline-offset:3px}
nav .fab{position:relative}
nav .fab i{position:absolute;top:-30px;left:50%;margin-left:-31px;width:62px;height:62px;border-radius:50%;background:var(--pri);border:2px solid var(--pri-d);box-shadow:0 4px 0 var(--pri-d);display:grid;place-items:center;color:#FBF7EC}
nav .fab i svg{width:30px;height:30px;stroke-width:2}
nav .fab.live i{background:var(--paper);color:var(--pri);border-color:var(--pri)}
nav .fab em{position:absolute;top:-36px;right:calc(50% - 46px);font:700 11px var(--tick);background:var(--bad);color:#fff;border-radius:8px;padding:1px 5px;font-style:normal}

/* ---- Hojas que suben (diálogos) ---- */
dialog{border:0;padding:0;margin:auto auto 0;width:100%;max-width:560px;max-height:92vh;border-radius:16px 16px 0 0;background:var(--card);color:var(--ink);
  box-shadow:0 -2px 0 var(--line)}
dialog[open]{animation:up .24s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(100%)}}
@media (prefers-reduced-motion:reduce){dialog[open]{animation:none}}
dialog::backdrop{background:rgba(35,24,15,.5)}
dialog .in{padding:8px 18px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
dialog .grab{width:46px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px;touch-action:none}
dialog h3{margin:0 0 12px;font-size:25px;line-height:1.15}
</style>
</head>
<body>
<main id="main"></main>
<div id="caja"></div>
<nav id="nav" aria-label="Secciones">
  <button data-t="inicio"><svg viewBox="0 0 24 24"><path d="M4 11l8-6 8 6v8.5a.5.5 0 0 1-.5.5H15v-6H9v6H4.5a.5.5 0 0 1-.5-.5z"/></svg><span>Inicio</span></button>
  <button data-t="despensa"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM5 10h14M5 15h14"/><path d="M9 7h2M13 12.5h2M9 17.5h2"/></svg><span>Despensa</span></button>
  <button data-t="mercar" class="fab"><i><svg viewBox="0 0 24 24"><path d="M3 4h2.5l2.2 10.2a1 1 0 0 0 1 .8h8.6a1 1 0 0 0 1-.8L20 8H6.4"/><circle cx="9.5" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg></i><span id="fabL">Mercar</span></button>
  <button data-t="cuentas"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-2-1.5-2 1.5-2-1.5-2 1.5-2-1.5L6 21z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg><span>Cuentas</span></button>
  <button data-t="cerebro"><svg viewBox="0 0 24 24"><path d="M12 3a5 5 0 0 0-5 5c0 1.8.9 3 2 4 .6.6 1 1.4 1 2.2V16h4v-1.8c0-.8.4-1.6 1-2.2 1.1-1 2-2.2 2-4a5 5 0 0 0-5-5z"/><path d="M10 19h4M10.5 21.5h3"/></svg><span>Cerebro</span></button>
</nav>
<datalist id="prodlist"></datalist>

<dialog id="dlg"><div class="in"><div class="grab"></div><div id="dlgIn"></div></div></dialog>
<div id="toast"></div>

<script>
// ===== Utilidades =====
const KEY='mimercado.v1';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Math.round(n||0).toLocaleString('es-CO');
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
const fdate=s=>new Date(s+'T12:00:00').toLocaleDateString('es-CO',{day:'numeric',month:'short'});
const slug=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const num=v=>{const n=parseFloat(String(v).replace(/[^\d.,]/g,'').replace(/\./g,'').replace(',','.'));return isNaN(n)?0:n};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1900)}

const CATS={aseo:'🧼 Aseo y hogar',frescos:'🥬 Aliños y frescos',proteinas:'🍗 Proteínas',granos:'🍚 Granos y despensa',lacteos:'🥛 Lácteos y huevos',casa:'🏠 Casa y misceláneos',otros:'🛍️ Otros'};
const isMisc=pid=>prod(pid)?.cat==='casa';
const MISC_RE=/recogedor|escoba|trapero|bolsas? (de )?basura|balde|cepillo|brillo|esponja|bombillo|foco|pilas?\b|vela|jarra|vaso|plato|olla|sart[eé]n|toalla|cortina|s[aá]bana|cuchar|tenedor|cuchillo|contenedor|coca\b|recipiente|gancho|decoraci|cojin|coj[ií]n|matera|organizador|canasta|tapete|ambientador el[eé]ctrico/;
const guessCat=n=>{const t=slug(n).replace(/-/g,' ');if(MISC_RE.test(t))return 'casa';const d=Object.keys(CATK).find(k=>CATK[k].test(n));return d||'otros'};
const PRIO={1:'Esencial',2:'Importante',3:'Si alcanza'};

// ===== Datos iniciales (del Plan de Mercado) =====
function seed(){
  const P=(name,cat,min,max,prio,unit)=>({id:slug(name),name,cat,ref:{min,max:max||min},prio,unit:unit||'und'});
  const products=[
    P('Lavaplatos líquido','aseo',3500,4500,1),P('Esponjas para loza','aseo',1500,2000,1),
    P('Papel higiénico x4-6','aseo',6000,8000,1,'paq'),P('Jabón de cuerpo','aseo',3000,4500,1),
    P('Crema de dientes','aseo',4000,5500,1),P('Máquinas de afeitar','aseo',4000,7000,2,'paq'),
    P('Jarra para agua con tapa','aseo',6000,10000,2),P('Ambientador','aseo',4000,6000,3),
    P('Detergente ropa','aseo',7000,9500,2,'bolsa'),
    P('Cebolla larga y cabezona','frescos',4000,4000,1),P('Tomate maduro','frescos',4000,4000,1,'lb'),
    P('Ajo (cabeza o pasta)','frescos',2000,2000,1),P('Cilantro','frescos',1000,1000,2,'atado'),

    if(lock!=='x')return;dx=Math.max(-140,Math.min(140,mx));sw.style.transform=`translateX(${dx}px)`;el.setPointerCapture&&el.setPointerCapture(e.pointerId)});
  const end=()=>{if(!on)return;on=false;sw.style.transition='';const id=el.dataset.id,done=el.classList.contains('done');

  const mk=(yy,mm,dd)=>{const last=new Date(yy,mm,0).getDate();return `${yy}-${String(mm).padStart(2,'0')}-${String(Math.min(dd,last)).padStart(2,'0')}`};

  if(!m.n&&!hab&&!pe)return{v:0,why:'Aún no tengo con qué calcular. Haz tu primer mercado y aprendo de lo que gastes.'};
  if(!m.n){const v=hab||r5(pe*1.15);return{v,why:hab?'Es tu presupuesto habitual. Después de tu primer mercado lo ajusto con lo que gastes de verdad.':`Lo que falta (~${money(pe)}) más un 15% de margen.`}}

  S.pantry.filter(pLow).forEach(x=>{const pid=x.pid&&prod(x.pid)?x.pid:ensureProduct(x.name);if(!pid||seen.has(pid))return;seen.add(pid);x.pid=pid;out.push({pid,qty:lastBuy(pid)?.qty||1,why:x.n!=null?`Queda${x.n===1?'':'n'} ${x.n} en la despensa`:'Queda poco en la despensa'})});

// ----- Presentación y precio por unidad -----
function parseSize(t){t=String(t||'').toLowerCase().replace(',','.');let m=t.match(/([\d.]+)\s*(kg|g|gr|l|lt|ml|cc)\b/);
  if(m){let q=parseFloat(m[1]),u=m[2];if(u==='kg'){q*=1000;u='g'}if(u==='gr')u='g';if(u==='l'||u==='lt'){q*=1000;u='ml'}if(u==='cc')u='ml';return q?{q,u}:null}
  m=t.match(/x\s*(\d+)/);if(m)return{q:+m[1],u:'und'};return null}
function unitPrice(price,size){const z=parseSize(size);if(!z||!price)return'';
  if(z.u==='und')return money(price/z.q)+' c/u';const per=z.u==='g'?(z.q>=500?1000:100):(z.q>=500?1000:100);
  return money(price/z.q*per)+' por '+(per===1000?(z.u==='g'?'kg':'litro'):(z.u==='g'?'100 g':'100 ml'))}

let gen=null;
function tplTotal(t){return t.items.reduce((a,i)=>a+est(i.pid)*i.qty,0)}
function listas(){
  let h=`<div class="card"><h2>Lista para un presupuesto</h2>

  <button class="p" style="flex:1" onclick="genList()">Generar</button></div>`;
  if(gen){h+=`<div style="margin-top:12px">`;
    gen.items.forEach(i=>{h+=`<div class="it"><div class="n"><b>${esc(pname(i.pid))}</b><small>${i.qty} · ${PRIO[prod(i.pid).prio]}</small></div><span class="price">${money(est(i.pid)*i.qty)}</span></div>`});
    h+=`<p class="row" style="justify-content:space-between"><span>Total <b>${money(gen.total)}</b></span><span class="mut">Te sobran ${money(gen.budget-gen.total)}</span></p>
    ${gen.skipped.length?`<p class="mut">No alcanzó: ${gen.skipped.map(esc).join(', ')}</p>`:''}
    <div class="acts"><button onclick="saveGen()">💾 Guardar</button><button class="p" onclick="useGen()">Usar como lista</button></div></div>`}
  h+=`</div><div class="card"><h2>📚 Mis listas guardadas</h2>`;
  if(!S.templates.length)h+=`<div class="empty">No hay listas guardadas.</div>`;
  S.templates.forEach(t=>{h+=`<div class="it"><div class="n"><b>${esc(t.name)}${S.settings.basket===t.id?' <span class="chip">canasta base</span>':''}</b><small>${t.items.length} productos · aprox. ${money(tplTotal(t))}</small></div>
    <button class="sm" onclick="loadTpl('${t.id}')">Cargar</button><button class="g" onclick="tplMenu('${t.id}')">⋯</button></div>`});
  return h+`</div>`;
}
function genList(){
  const budget=num($('#gB').value),target=budget;
  const has=n=>S.pantry.some(x=>slug(n).split('-').some(w=>w.length>3&&slug(x.name).includes(w)));
  const cand=S.products.filter(p=>est(p.id)>0).sort((a,b)=>a.prio-b.prio||est(a.id)-est(b.id));
  let total=0;const items=[],skipped=[];
  for(const p of cand){if(p.prio>1&&has(p.name))continue;const c=est(p.id);if(total+c<=target){items.push({pid:p.id,qty:1});total+=c}else if(p.prio<3)skipped.push(p.name)}
  gen={budget,total,items,skipped};render()}
function useGen(){if(S.list.some(i=>!i.done)&&!confirm('¿Reemplazar tu lista actual?'))return;S.list=gen.items.map(i=>({id:uid(),pid:i.pid,qty:i.qty,done:false}));gen=null;go('lista');toast('Lista lista 😉')}
function saveGen(){const n=prompt('Nombre de la lista',`Lista ${money(gen.budget)}`);if(!n)return;S.templates.push({id:uid(),name:n,items:gen.items});render();toast('Guardada')}
function saveAsTemplate(){const items=S.list.map(i=>({pid:i.pid,qty:i.qty}));if(!items.length)return toast('La lista está vacía');const n=prompt('Nombre para esta lista','Mi lista '+fdate(today()));if(!n)return;S.templates.push({id:uid(),name:n,items});render();toast('Lista guardada')}
function loadTpl(id){const t=S.templates.find(x=>x.id===id);t.items.forEach(it=>{if(!prod(it.pid))return;const ex=S.list.find(i=>i.pid===it.pid&&!i.done);if(ex)ex.qty=Math.max(ex.qty,it.qty);else S.list.push({id:uid(),pid:it.pid,qty:it.qty,done:false})});go('lista');toast('Lista cargada')}
function tplMenu(id){const t=S.templates.find(x=>x.id===id);openDlg(`<h3>${esc(t.name)}</h3>${t.items.map(i=>`<div class="it"><div class="n"><b>${esc(pname(i.pid))}</b></div><span class="mut">${i.qty}</span><span class="price">${money(est(i.pid)*i.qty)}</span></div>`).join('')}
  <div class="acts"><button class="d" onclick="S.templates=S.templates.filter(x=>x.id!=='${id}');closeDlg();render()">Borrar</button>
  <button onclick="S.settings.basket='${id}';closeDlg();render();toast('Será tu canasta de referencia')">Usar como canasta base</button>

const TIPS=[
 ['🥬','Frescos en la galería','Cebolla, tomate, cilantro y plátano suelen salir más baratos en la plaza o galería del barrio que en el supermercado. Compra solo lo de 4-5 días para que no se dañe.'],

function cerebro(part){
  const st=S.settings,pe=pending(),m=marketStats(),sg=suggestBudget(),l=m.last;
  const T=[];
  if(sg.v)T.push(['🧺','Tu próximo mercado',`Te sugiero ${money(sg.v)}. ${sg.why} Cada mercado arranca de cero: lo que sobre o falte en uno no se arrastra al siguiente.`]);
  if(l&&l.budget)T.push(l.total>l.budget?['⚠️','El último se pasó',`Gastaste ${money(l.total)} con presupuesto de ${money(l.budget)}: ${money(l.total-l.budget)} de más. Lo tengo en cuenta para sugerirte el siguiente.`]
    :['✅','El último quedó por debajo',`Gastaste ${money(l.total)} de ${money(l.budget)}. Bien: esos ${money(l.budget-l.total)} quedan libres para lo que necesites.`]);
  else if(l)T.push(['🛒','El último fue sin tope',`Gastaste ${money(l.total)}${l.total<(m.n>=3?m.med:m.avg)*.3?'. Fue una compra pequeña de paso, no la cuento como mercado':m.n>1?`, ${l.total>m.avg?Math.round((l.total/m.avg-1)*100)+'% más':Math.round((1-l.total/m.avg)*100)+'% menos'} que tu promedio`:''}.`]);
  if(m.n&&pe>(m.n>=3?m.med:m.avg)*1.1){const cut=S.list.filter(i=>!i.done&&prod(i.pid)?.prio===3).map(i=>pname(i.pid));T.push(['🚨','Lo que falta es mucho',`Ya suma ~${money(pe)}, más que tu mercado típico.${cut.length?' Lo que puede esperar: '+cut.join(', ')+'.':''}`])}
  // tiendas
  const wins={};let cmp=0;S.products.forEach(p=>{const os=st.stores.map(s=>latest(p.id,s)).filter(Boolean);if(os.length>1){cmp++;const b=os.reduce((a,o)=>o.price<a.price?o:a);wins[b.store]=(wins[b.store]||0)+1}});
  if(cmp){const w=Object.entries(wins).sort((a,b)=>b[1]-a[1])[0];T.push(['🏪','Tienda más barata',`${w[0]} fue la más barata en ${w[1]} de ${cmp} productos que has comparado.`])}
  else T.push(['🏪','Compara tiendas','Anota el precio de un mismo producto en D1, Ara u Olímpica (pestaña Precios) y aquí te diré cuál te conviene.']);
  // alzas
  const ups=[];S.products.forEach(p=>{const o=obsOf(p.id);if(o.length>1&&o[0].price>o[1].price*1.1)ups.push(`${p.name} (+${Math.round((o[0].price/o[1].price-1)*100)}%)`)});
  if(ups.length)T.push(['📈','Subieron de precio',ups.slice(0,5).join(', ')]);
  // canasta
  const bt=S.templates.find(t=>t.id===st.basket);
  if(bt){const now=tplTotal(bt),ref=bt.items.reduce((a,i)=>{const p=prod(i.pid);return a+(p?(p.ref.min+p.ref.max)/2*i.qty:0)},0);
    const per=st.stores.map(s=>{let tot=0,ok=0;bt.items.forEach(i=>{const o=latest(i.pid,s);if(o){tot+=o.price*i.qty;ok++}});return[s,tot,ok]}).filter(x=>x[2]);
    T.push(['🧺',`Tu canasta “${bt.name}”`,`Hoy cuesta aprox. ${money(now)} (con precios de referencia era ${money(ref)}; ${now>ref?'subió '+money(now-ref):'bajó '+money(ref-now)}).${per.length?' Por tienda: '+per.map(([s,t,ok])=>`${s} ${money(t)} (${ok}/${bt.items.length} prod.)`).join(' · '):''}`])}
  // ritmo de consumo: aprende cada cuánto compras algo
  const due=[];S.products.forEach(p=>{const ds=[...new Set(S.purchases.filter(x=>x.pid===p.id).map(x=>x.date))].sort();if(ds.length<2)return;
    const gap=daysBetween(ds[0],ds[ds.length-1])/(ds.length-1),next=addDays(ds[ds.length-1],Math.round(gap));if(gap>=3&&daysBetween(today(),next)<=4)due.push(`${p.name} (cada ~${Math.round(gap)} días)`)});
  if(due.length)T.push(['🔁','Pronto se te acaba',due.join(', ')]);
  const np=S.purchases.filter(x=>x.noPrice).length;if(np)T.push(['⚠️','Compras sin precio',`Tienes ${np} compra(s) sin precio. Importa la factura y se completan solas.`]);
  const ya=RECETAS.filter(r=>!recipeState(r).miss.length);if(ya.length)T.push(['🍲','Puedes cocinar ya',`${ya.slice(0,4).map(r=>r.t).join(', ')}${ya.length>4?' y más':''}. Mira la pestaña Cocina para los pasos.`]);
  const bm=basicMissing();if(bm.length)T.push(['🧂','Falta lo básico',`No tienes ${bm.map(k=>ING[k].l.toLowerCase()).join(', ')}. Te lo sugiero al iniciar el mercado.`]);
  const tip=TIPS[new Date().getDate()%TIPS.length];T.push(tip);
  if(part!=='ajustes'){let h=`<div class="card"><h2>Lo que veo</h2>${T.map(([e,t,p])=>`<div class="tip"><div class="e" aria-hidden="true">${e}</div><div><b>${esc(t)}</b><p>${esc(p)}</p></div></div>`).join('')}</div>`;
  h+=`<div class="card"><h2>Pregúntale al Cerebro</h2>
  ${aiKey()?`<textarea id="aq" rows="2" placeholder="Ej: ¿qué compro con lo que me queda hasta el 15?"></textarea><div class="acts" style="margin-top:8px"><button class="p" onclick="askAI()">Preguntar</button></div><div id="aa" style="white-space:pre-wrap;font-size:14px"></div>`
  :`<p class="mut" style="margin-top:0">Para preguntarle aquí y leer fotos de facturas, agrega tu clave de la API de Claude abajo. Sin clave, copia tu contexto y pégalo en tu proyecto “Mercado Mensual”.</p>`}
  <div class="acts" style="justify-content:stretch"><button style="flex:1" onclick="copyCtx()">📋 Copiar contexto</button>${navigator.share?`<button onclick="shareCtx()">Compartir</button>`:''}</div>
  <details style="margin-top:8px"><summary>🔑 Clave de IA</summary><p class="mut">Se guarda solo en este teléfono y no va en las copias de seguridad. Créala en console.anthropic.com.</p>
  <input id="ak" type="password" value="${esc(aiKey())}" placeholder="sk-ant-…"><label>Modelo</label><input id="am" value="${esc(aiModel())}">
  <div class="acts"><button onclick="saveAI()">Guardar clave</button></div></details></div>`;return h}
  let h=`<div class="card"><h2>Ajustes</h2>
  <p class="mut" style="margin-top:0">El presupuesto se decide en cada mercado. Aquí solo va tu punto de partida mientras el Cerebro aprende.</p>

  <div><label>Por defecto</label><select id="sNB"><option value="0" ${st.noBudget?'':'selected'}>Con presupuesto</option><option value="1" ${st.noBudget?'selected':''}>Lo que se vaya</option></select></div>
  <div><label>Tienda habitual</label><select id="sT">${st.stores.map(s=>`<option ${s===st.store?'selected':''}>${esc(s)}</option>`).join('')}</select></div>
  <div><label>Tiendas (separadas por coma)</label><input id="sL" value="${esc(st.stores.join(', '))}"></div>

  <div><label>Avisos</label><button type="button" style="width:100%" onclick="enableNotif()">${typeof Notification!=='undefined'&&Notification.permission==='granted'?'🔔 Activados':'🔔 Activar avisos'}</button></div></div>
  <div class="acts"><button class="g" onclick="tour(0)">📘 Tutorial</button><button class="p" onclick="saveSettings()">Guardar</button></div></div>`;
  h+=`<div class="card"><h2>Historial y archivos</h2><p class="mut" style="margin-top:0">Copias automáticas (una por día y antes de cada cambio grande) y las fotos de tus facturas. Puedes volver a cualquier punto.</p>
  <div class="acts" style="justify-content:flex-start"><button class="p" onclick="openHistory()">Abrir historial</button><button onclick="snapshot('Punto guardado a mano').then(()=>toast('Punto guardado ✓'))">📌 Guardar punto</button></div></div>`;
  h+=`<div class="card"><h2>Copia de seguridad</h2><p class="mut" style="margin-top:0">Todo vive solo en este dispositivo. ${S.lastBackup?'Última copia: '+new Date(S.lastBackup).toLocaleDateString('es-CO',{day:'numeric',month:'short'})+'.':'Aún no has guardado ninguna copia.'} Te recordaré cada 15 días.</p>

  <input id="imp" type="file" accept=".json,application/json" hidden onchange="importData(this.files[0])"></div>`;
  return h;
}
function saveSettings(){const st=S.settings;st.paydays=$('#sD').value.split(',').map(x=>parseInt(x)).filter(x=>x>=1&&x<=31);if(!st.paydays.length)st.paydays=[15,30];st.budget=num($('#sB').value);st.noBudget=$('#sNB').value==='1';

function backupDue(){const has=S.trips.length||S.purchases.length;if(!has||S.trip)return 0;const now=Date.now();if(S.backupSnooze&&now<S.backupSnooze)return 0;

    if('BarcodeDetector' in window){const r=await new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']}).detect(bmp).catch(()=>[]);if(r.length)return gotCode(r[0].rawValue)}
    M.textContent='No vi código; leyendo la etiqueta…';await loadOCR();
    const w=await ocrWorker();const {data}=await w.recognize(c);await w.terminate();
    const t=data.text.replace(/\s+/g,' '),low=slug(t);
    const sz=(t.match(/(\d+(?:[.,]\d+)?)\s*(kg|g|gr|ml|l|lt|cc)\b/i)||[])[0]||'';
    const code=(t.match(/\b(77\d{11})\b/)||[])[1];if(code)return gotCode(code);
    let best=null,sc=0;S.products.forEach(p=>{const ws=[...slug(p.name).split('-'),...slug(p.brand||'').split('-')].filter(w=>w.length>=4);const n=ws.filter(w=>low.includes(w)).length;if(n>sc){sc=n;best=p}});
    closeDlg();
    if(best&&sc>=2){buy(null,best.id);if(sz&&!$('#bSz').value){$('#bSz').value=sz;bTot()}toast('Parece '+best.name+'. Revisa los datos')}
    else{buy();const words=t.split(' ').filter(w=>/^[A-Za-zÁÉÍÓÚÑáéíóúñ]{4,}$/.test(w)).slice(0,4).join(' ');$('#bN').value=words;$('#bSz').value=sz;bTot();toast('No lo reconocí: corrige el nombre y quedará aprendido')}
  }catch(e){M.textContent='⚠️ '+e.message}}

// ===== Historial: copias y archivos (IndexedDB, en el teléfono) =====
const idb=(()=>{let db;const open=()=>db?Promise.resolve(db):new Promise((ok,ko)=>{const r=indexedDB.open('mimercado',2);
  r.onupgradeneeded=()=>{const d=r.result;for(const n of ['snaps','files','meta'])if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'})};r.onsuccess=()=>{db=r.result;ok(db)};r.onerror=()=>ko(r.error)});
  const tx=(st,mode,fn)=>open().then(d=>new Promise((ok,ko)=>{const t=d.transaction(st,mode),q=fn(t.objectStore(st));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>ko(t.error)}));
  return{put:(st,v)=>tx(st,'readwrite',o=>o.put(v)),all:st=>tx(st,'readonly',o=>o.getAll()),get:(st,k)=>tx(st,'readonly',o=>o.get(k)),del:(st,k)=>tx(st,'readwrite',o=>o.delete(k))}})();
let FILES=[];
const fileFor=(d,st)=>FILES.find(f=>f.date===d&&f.store===st);
async function loadFiles(){try{FILES=(await idb.all('files')).map(({blob,...m})=>m);if(tab==='cuentas'||tab==='inicio')render()}catch(e){}}
async function snapshot(reason){try{const sp=spent();await idb.put('snaps',{id:uid(),ts:Date.now(),reason,spent:sp,n:S.purchases.length,data:JSON.stringify(S)});
  const all=(await idb.all('snaps')).sort((a,b)=>b.ts-a.ts);for(const x of all.slice(40))await idb.del('snaps',x.id)}catch(e){}}
async function autoSnap(){try{const all=await idb.all('snaps');if(!all.some(x=>new Date(x.ts).toDateString()===new Date().toDateString()))await snapshot('Copia automática del día')}catch(e){}}
async function saveFile(f,meta){try{const {c}=await prepImg(f,1600,'none');const blob=await new Promise(ok=>c.toBlob(ok,'image/jpeg',.75));
  const old=fileFor(meta.date,meta.store);await idb.put('files',{id:old?old.id:uid(),ts:Date.now(),kind:'factura',...meta,blob});await loadFiles()}catch(e){toast('No pude guardar la foto')}}
function attachFile(d,st){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=async()=>{if(i.files[0]){await saveFile(i.files[0],{date:d,store:st,total:S.purchases.filter(x=>x.date===d&&x.store===st).reduce((a,x)=>a+x.total,0)});render();toast('Factura guardada ✓')}};i.click()}
async function viewFile(id){const f=await idb.get('files',id);if(!f)return;const u=URL.createObjectURL(f.blob);
  openDlg(`<h3>🧾 ${esc(f.store)} · ${fdate(f.date)}</h3>${f.total?`<p class="mut" style="margin-top:0">Total registrado ${money(f.total)}</p>`:''}<img src="${u}" style="width:100%;border-radius:10px">
  <div class="acts"><button class="d" onclick="if(confirm('¿Borrar esta foto?'))idb.del('files','${id}').then(loadFiles).then(()=>{closeDlg();render()})">Borrar</button>
  <a href="${u}" download="factura-${esc(f.store)}-${f.date}.jpg"><button>Descargar</button></a><button class="p" onclick="closeDlg()">Cerrar</button></div>`)}
async function openHistory(){const snaps=(await idb.all('snaps').catch(()=>[])).sort((a,b)=>b.ts-a.ts);await loadFiles();
  const dt=ts=>new Date(ts).toLocaleString('es-CO',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
  openDlg(`<h3>🗂️ Historial</h3><div class="cat">Puntos de restauración (${snaps.length})</div>
  ${snaps.length?snaps.map(x=>`<div class="it"><div class="n"><b>${esc(x.reason)}</b><small>${dt(x.ts)} · ${x.n} compras · gastado ${money(x.spent)}</small></div>
    <button class="g sm" onclick="dlSnap('${x.id}')">⬇</button><button class="sm" onclick="restoreSnap('${x.id}')">Volver</button></div>`).join(''):'<div class="empty">Aún no hay copias.</div>'}
  <div class="cat">Facturas guardadas (${FILES.length})</div>
  ${FILES.length?FILES.sort((a,b)=>a.date<b.date?1:-1).map(f=>`<div class="it" onclick="viewFile('${f.id}')"><div class="n"><b>🧾 ${esc(f.store)}</b><small>${fdate(f.date)}${f.total?' · '+money(f.total):''}</small></div><span class="mut">Ver ›</span></div>`).join(''):'<div class="empty">Cuando importes una factura con foto, o adjuntes una en 🧾 Gastos, aparece aquí.</div>'}
  <p class="mut">Se guardan en este teléfono (máx. 40 copias). Para tenerlas fuera del teléfono usa “Descargar copia”.</p>
  <div class="acts"><button class="p" onclick="closeDlg()">Cerrar</button></div>`)}
async function dlSnap(id){const x=await idb.get('snaps',id);const b=new Blob([x.data],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`mi-mercado-${new Date(x.ts).toISOString().slice(0,16).replace(':','')}.json`;a.click()}
async function restoreSnap(id){const x=await idb.get('snaps',id);if(!x||!confirm(`¿Volver al punto “${x.reason}”? Tu estado actual queda guardado en el historial.`))return;
  await snapshot('Antes de volver a un punto anterior');S=migrate(JSON.parse(x.data));closeDlg();render();toast('Restaurado ✓')}

// ===== Bienvenida y tutorial (dispositivo nuevo) =====
function nextPayday(pd,from){from=from||today();for(let i=1;i<=62;i++){const d=addDays(from,i),[y,m,dd]=d.split('-').map(Number),last=new Date(y,m,0).getDate();
  if(pd.some(x=>Math.min(x,last)===dd))return d}return addDays(from,15)}
const W={};
function wizard(step){const st=S.settings,steps=4,dots=`<p class="mut" style="text-align:center;margin:12px 0 0">${'●'.repeat(step+1)}${'○'.repeat(steps-step-1)}</p>`;
  if(step===0)return openDlg(`<h3>🧺 ¡Bienvenido a Mi Mercado!</h3>
    <p>Te ayuda a planear el mercado, saber cuánto llevas gastado, comparar precios entre tiendas y no olvidar lo que hace falta en casa.</p>
    <p class="mut">Todo se guarda solo en este teléfono. Nadie más ve tus datos.</p>
    <div class="acts" style="flex-direction:column;align-items:stretch"><button class="p" style="white-space:normal" onclick="wizard(1)">Empezar desde cero</button>
    <button style="white-space:normal" onclick="closeDlg();S.onboarded=true;save();$('#imp')?$('#imp').click():(go('cerebro','ajustes'),setTimeout(()=>$('#imp').click(),200))">📂 Ya la uso en otro teléfono (restaurar copia)</button></div>${dots}`);
  if(step===1)return openDlg(`<h3>💰 Tu mercado</h3><p class="mut" style="margin-top:0">Cada mercado tiene su propio presupuesto, y la app aprende de lo que gastas. Para empezar, ¿cuánto sueles gastar en uno? Si no sabes, déjalo vacío.</p>
    <label>Lo que sueles gastar (opcional)</label><input id="wB" inputmode="numeric" placeholder="Ej: 120000" value="${st.budget||''}">
    <label>¿Qué días te pagan? (separados por coma)</label><input id="wD" value="${(st.paydays||[15,30]).join(', ')}">
    <div class="acts"><button class="g" onclick="wizard(0)">Atrás</button><button class="p" onclick="wSave1()">Siguiente</button></div>${dots}`);
  if(step===2)return openDlg(`<h3>🏪 ¿Dónde compras?</h3><p class="mut" style="margin-top:0">Elige tu tienda habitual. Luego puedes comparar con las demás.</p>
    <div class="row" style="flex-wrap:wrap;gap:6px">${st.stores.map(x=>`<button class="${x===st.store?'p':''}" onclick="S.settings.store='${esc(x)}';wizard(2)">${esc(x)}</button>`).join('')}</div>
    <div class="acts"><button class="g" onclick="wizard(1)">Atrás</button><button class="p" onclick="wizard(3)">Siguiente</button></div>${dots}`);
  if(step===3){const common=['Arroz','Huevos','Aceite','Sal','Azúcar','Panela','Leche','Café','Pasta','Lentejas','Fríjol','Avena','Papas','Cebolla','Tomate','Ajo','Papel higiénico','Jabón','Crema dental','Lavaloza'];W.sel=W.sel||new Set();
    return openDlg(`<h3>🏠 ¿Qué tienes en casa?</h3><p class="mut" style="margin-top:0">Toca lo que ya tienes. Lo que falte lo puedes anotar como pendiente. (Opcional)</p>
    <div class="row" style="flex-wrap:wrap;gap:6px">${common.map(x=>`<button class="sm ${W.sel.has(x)?'p':''}" onclick="W.sel.has('${x}')?W.sel.delete('${x}'):W.sel.add('${x}');wizard(3)">${x}</button>`).join('')}</div>
    <div class="acts"><button class="g" onclick="wizard(2)">Atrás</button><button class="p" onclick="wFinish()">Terminar</button></div>${dots}`)}
}
function wSave1(){const st=S.settings;st.budget=num($('#wB').value);
  st.paydays=$('#wD').value.split(',').map(x=>parseInt(x)).filter(x=>x>=1&&x<=31);if(!st.paydays.length)st.paydays=[15,30];wizard(2)}
function wFinish(){(W.sel||new Set()).forEach(n=>{if(!S.pantry.some(x=>slug(x.name)===slug(n)))S.pantry.push({id:uid(),name:n,qty:'',n:null,lvl:3,upd:today()})});
  S.onboarded=true;S.asked[qKey()]='inicio';render();tour(0)}
const TOUR=[
 ['🛒','Inicio','Tu próximo mercado en un tiquete: cuánto costó el último, cuánto cuesta lo que falta y cuánto te sugiero gastar. Abajo, “Lo que falta”: anota ahí lo que se vaya acabando. El botón verde del centro inicia el mercado.'],
 ['🏠','Despensa','Lo que hay en casa. Resta con − lo que se cuenta (huevos, jabones) y toca el nivel de lo demás (arroz, aceite). Lo que se acaba, el Cerebro te lo sugiere.'],
 ['✅','Mientras compras','Tu lista es una hoja de cuaderno: desliza a la derecha lo que echas al carrito y escribe el precio; a la izquierda si no había. Abajo ves cuánto llevas, como en la caja.'],
 ['🧾','Al llegar a casa','Usa “Importar factura” con una foto del recibo: registra todo de una vez y revisa que cuadre con el total. Luego toca “Finalizar mercado” y tu despensa se actualiza sola.'],
 ['🧠','El Cerebro','En Cocina te dice qué preparar con lo que hay, paso a paso, y descuenta de la despensa lo que usas. Además aprende de tus mercados: te dice cuánto puedes gastar por día, qué tienda es más barata, qué se te va a acabar y te sugiere qué comprar.'],
 ['💾','Tus datos','Viven solo en este teléfono. En Cerebro → Copia de seguridad descarga una copia de vez en cuando. Si cambias de teléfono, la restauras y sigues igual.']];
function tour(i){const [e,t,x]=TOUR[i];openDlg(`<div style="text-align:center;font-size:44px">${e}</div><h3 style="text-align:center">${t}</h3><p style="text-align:center">${x}</p>
  <p class="mut" style="text-align:center">${i+1} de ${TOUR.length}</p>
  <div class="acts">${i?`<button class="g" onclick="tour(${i-1})">Atrás</button>`:`<button class="g" onclick="closeDlg()">Saltar</button>`}<button class="p" onclick="${i<TOUR.length-1?`tour(${i+1})`:'closeDlg();toast(\'¡Listo para tu primer mercado!\')'}">${i<TOUR.length-1?'Siguiente':'¡Empezar!'}</button></div>`)}

// ===== Diálogo =====
function openDlg(h){$('#dlgIn').innerHTML=h;const d=$('#dlg');if(!d.open)d.showModal()}
function closeDlg(){$('#dlg').close()}
$('#dlg').addEventListener('click',e=>{if(e.target.id==='dlg')closeDlg()});
(()=>{const d=$('#dlg'),g=d.querySelector('.grab');let y0=null,dy=0;
  g.addEventListener('pointerdown',e=>{y0=e.clientY;dy=0;g.setPointerCapture(e.pointerId);d.style.transition='none'});
  g.addEventListener('pointermove',e=>{if(y0===null)return;dy=Math.max(0,e.clientY-y0);d.style.transform=`translateY(${dy}px)`});
  const up=()=>{if(y0===null)return;y0=null;d.style.transition='transform .18s';if(dy>90){d.style.transform='translateY(100%)';setTimeout(()=>{closeDlg();d.style.transform='';d.style.transition=''},170)}else d.style.transform=''};
  g.addEventListener('pointerup',up);g.addEventListener('pointercancel',up)})();

go('lista');handleParams();if(!S.onboarded)setTimeout(()=>wizard(0),400);
loadFiles().then(autoSnap);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
