<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi Mercado</title>
<meta name="theme-color" content="#2f6b4f">
<meta name="description" content="Lista de compras, registro de precios y presupuesto de mercado">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f7f3ea;--card:#fffdf8;--ink:#2b2a26;--mut:#7a756a;--line:#e7e0d1;--pri:#2f6b4f;--pri2:#e4efe8;--warn:#b5651d;--warn2:#fbeee0;--bad:#b23b3b;--bad2:#f8e3e3;--ok:#2f7a3e}
@media (prefers-color-scheme:dark){:root{--bg:#171a17;--card:#202520;--ink:#ecebe5;--mut:#a3a397;--line:#323a32;--pri:#7cc59b;--pri2:#24392c;--warn:#e7a35f;--warn2:#3b2e20;--bad:#ee8a8a;--bad2:#3d2424;--ok:#7cc59b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{background:var(--pri);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 14px;position:sticky;top:0;z-index:5}
@media (prefers-color-scheme:dark){header{background:#1f3a2b}}
header h1{margin:0;font-size:17px;font-weight:650;display:flex;justify-content:space-between;align-items:center}
header small{opacity:.85;font-weight:400;font-size:12px}
.bud{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.bud div{background:rgba(255,255,255,.12);border-radius:10px;padding:6px 8px}
.bud b{display:block;font-size:15px}.bud span{font-size:11px;opacity:.85}
.bar{height:6px;background:rgba(255,255,255,.2);border-radius:4px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:4px}
main{padding:12px 16px;max-width:680px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
input,select,button,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
button{border:0;border-radius:10px;padding:9px 12px;background:var(--pri2);color:var(--pri);font-weight:600;cursor:pointer;white-space:nowrap}
button.p{background:var(--pri);color:#fff}
@media (prefers-color-scheme:dark){button.p{color:#10241a}}
button.g{background:transparent;color:var(--mut);padding:6px 8px}
button.d{background:var(--bad2);color:var(--bad)}
button.sm{padding:5px 9px;font-size:13px}
.it{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.it:first-of-type{border-top:0}
.it .n{flex:1;min-width:0}.it .n b{font-weight:550;display:block;overflow:hidden;text-overflow:ellipsis}
.it .n small,.mut{color:var(--mut);font-size:12.5px}
.it.done .n b{text-decoration:line-through;color:var(--mut)}
.ck{width:24px;height:24px;border-radius:7px;border:2px solid var(--pri);flex:none;display:grid;place-items:center;background:none;padding:0}
.done .ck{background:var(--pri);color:#fff}
.cat{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 2px}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:var(--pri2);color:var(--pri);margin:2px 4px 0 0}
.chip.w{background:var(--warn2);color:var(--warn)}.chip.b{background:var(--bad2);color:var(--bad)}
.price{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:8px 0 9px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px;line-height:1}
nav button.on{color:var(--pri)}
dialog{border:0;border-radius:18px;padding:0;width:min(94vw,460px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .in{padding:16px}
dialog h3{margin:0 0 12px;font-size:17px}
label{display:block;font-size:12.5px;color:var(--mut);margin:8px 0 3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.tip{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.tip:first-of-type{border-top:0}
.tip .e{font-size:22px;line-height:1.1}
.tip p{margin:2px 0 0;color:var(--mut);font-size:13.5px}
.hb{height:8px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:3px}.hb i{display:block;height:100%;background:var(--pri)}
table{width:100%;border-collapse:collapse;font-size:13.5px}td,th{padding:5px 4px;border-top:1px solid var(--line);text-align:left}th{color:var(--mut);font-weight:600;font-size:12px}
.links{display:flex;gap:6px;flex-wrap:wrap}.links a{text-decoration:none;font-size:13px;padding:6px 10px;border-radius:9px;background:var(--warn2);color:var(--warn);font-weight:600}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:20}
#toast.on{opacity:1}
details summary{cursor:pointer;font-weight:600;color:var(--pri);padding:4px 0}
.big{font-size:22px;font-weight:700}
.empty{color:var(--mut);text-align:center;padding:16px 0;font-size:14px}
</style>
</head>
<body>
<header>
  <h1>🧺 Mi Mercado <small id="per"></small></h1>
  <div class="bud">
    <div><b id="hB"></b><span>Presupuesto</span></div>
    <div><b id="hS"></b><span>Gastado</span></div>
    <div><b id="hR"></b><span>Disponible</span></div>
  </div>
  <div class="bar"><i id="hBar"></i></div>
</header>
<main id="main"></main>
<nav id="nav">
  <button data-t="lista"><span>📝</span>Lista</button>
  <button data-t="gastos"><span>🧾</span>Gastos</button>
  <button data-t="precios"><span>🏷️</span>Precios</button>
  <button data-t="listas"><span>📚</span>Listas</button>
  <button data-t="cerebro"><span>🧠</span>Cerebro</button>
</nav>
<datalist id="prodlist"></datalist>

<dialog id="dlg"><div class="in" id="dlgIn"></div></dialog>
<div id="toast"></div>

<script>
// ===== Utilidades =====
const KEY='mimercado.v1';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Math.round(n||0).toLocaleString('es-CO');
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
const fdate=s=>new Date(s+'T12:00:00').toLocaleDateString('es-CO',{day:'numeric',month:'short'});
const slug=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const num=v=>{const n=parseFloat(String(v).replace(/[^\d.,]/g,'').replace(/\./g,'').replace(',','.'));return isNaN(n)?0:n};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1900)}

const CATS={aseo:'🧼 Aseo y hogar',frescos:'🥬 Aliños y frescos',proteinas:'🍗 Proteínas',granos:'🍚 Granos y despensa',lacteos:'🥛 Lácteos y huevos',otros:'🛍️ Otros'};
const PRIO={1:'Esencial',2:'Importante',3:'Si alcanza'};

// ===== Datos iniciales (del Plan de Mercado) =====
function seed(){
  const P=(name,cat,min,max,prio,unit)=>({id:slug(name),name,cat,ref:{min,max:max||min},prio,unit:unit||'und'});
  const products=[
    P('Lavaplatos líquido','aseo',3500,4500,1),P('Esponjas para loza','aseo',1500,2000,1),
    P('Papel higiénico x4-6','aseo',6000,8000,1,'paq'),P('Jabón de cuerpo','aseo',3000,4500,1),
    P('Crema de dientes','aseo',4000,5500,1),P('Máquinas de afeitar','aseo',4000,7000,2,'paq'),
    P('Jarra para agua con tapa','aseo',6000,10000,2),P('Ambientador','aseo',4000,6000,3),
    P('Detergente ropa','aseo',7000,9500,2,'bolsa'),
    P('Cebolla larga y cabezona','frescos',4000,4000,1),P('Tomate maduro','frescos',4000,4000,1,'lb'),
    P('Ajo (cabeza o pasta)','frescos',2000,2000,1),P('Cilantro','frescos',1000,1000,2,'atado'),
    P('Plátanos','frescos',4000,4000,2),P('Aceite repuesto','granos',4500,4500,1,'bolsa'),
    P('Arroz','granos',4000,5000,1,'lb'),P('Lentejas','granos',3500,4500,2,'lb'),
    P('Fríjol','granos',5500,7000,3,'lb'),P('Pasta / espagueti','granos',2500,3500,2,'paq'),
    P('Avena en hojuelas','granos',3500,5000,2,'bolsa'),P('Panela','granos',2000,3000,2),
    P('Azúcar','granos',2800,3500,3,'lb'),P('Café','granos',8000,12000,3,'paq'),
    P('Atún en lata','proteinas',5000,6500,3,'lata'),
    P('Pollo (pechuga o muslos)','proteinas',18000,24000,2,'bandeja'),P('Queso / cuajada','lacteos',6000,8000,3),
    P('Arepas','granos',3000,4500,2,'paq'),P('Huevos x30','lacteos',15000,19000,2,'panal'),
    P('Leche bolsa','lacteos',4000,5000,2,'bolsa')
  ];
  const plan=['lavaplatos-liquido','esponjas-para-loza','papel-higienico-x4-6','jabon-de-cuerpo','crema-de-dientes','maquinas-de-afeitar','jarra-para-agua-con-tapa','ambientador','cebolla-larga-y-cabezona','tomate-maduro','ajo-cabeza-o-pasta','cilantro','aceite-repuesto','arroz','pollo-pechuga-o-muslos','queso-cuajada','arepas','platanos'];
  const tplPlan={id:'plan-nov',name:'Plan quincena (archivo)',items:plan.map(p=>({pid:p,qty:1}))};
  const tplAseo={id:'aseo',name:'Solo aseo urgente',items:plan.slice(0,6).map(p=>({pid:p,qty:1}))};
  return {version:1,
    settings:{budget:150000,start:today(),end:'2026-11-15',reserve:30,store:'D1',stores:['D1','Ara','Olímpica','Galería/Plaza','Otra'],basket:'plan-nov'},
    products,
    list:plan.map(p=>({id:uid(),pid:p,qty:1,done:false})),
    purchases:[],prices:[],
    templates:[tplPlan,tplAseo],
    pantry:[{id:uid(),name:'Huevos',qty:'28'},{id:uid(),name:'Leche',qty:'3 bolsas'},{id:uid(),name:'Lentejas',qty:'2 lb'},{id:uid(),name:'Arroz',qty:'1 lb'},{id:uid(),name:'Espaguetis / pastas',qty:'algo'},{id:uid(),name:'Avena en hojuelas',qty:'algo'},{id:uid(),name:'Papas amarillas',qty:'1 bolsa'},{id:uid(),name:'Aceite',qty:'tarrito'},{id:uid(),name:'Sal',qty:'1 lb'},{id:uid(),name:'Panela',qty:'1'},{id:uid(),name:'Zanahoria',qty:'1'}]
  };
}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.version)return s}catch(e){}return seed()}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('⚠️ No se pudo guardar')}}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});

// ===== Lógica de precios =====
const prod=id=>S.products.find(p=>p.id===id);
const pname=id=>prod(id)?.name||id;
const obsOf=(pid,store)=>S.prices.filter(o=>o.pid===pid&&(!store||o.store===store)).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(b.ts||0)-(a.ts||0));
const latest=(pid,store)=>obsOf(pid,store)[0];
function est(pid){const o=latest(pid,S.settings.store)||latest(pid);if(o)return o.price;const p=prod(pid);return p?Math.round((p.ref.min+p.ref.max)/2):0}
const estSrc=pid=>latest(pid,S.settings.store)?'obs':latest(pid)?'otra':'ref';
function ensureProduct(name,cat){const id=slug(name);if(!id)return null;if(!prod(id))S.products.push({id,name:name.trim(),cat:cat||'otros',ref:{min:0,max:0},prio:2,unit:'und'});return id}
function inPeriod(d){return d>=S.settings.start&&d<=S.settings.end}
function spent(){return S.purchases.filter(p=>inPeriod(p.date)).reduce((a,p)=>a+p.total,0)}
function pending(){return S.list.filter(i=>!i.done).reduce((a,i)=>a+est(i.pid)*i.qty,0)}
function storeLinks(name){const q=encodeURIComponent(name);return `<div class="links">
<a target="_blank" rel="noopener" href="https://www.google.com/search?q=${q}+precio+tiendas+D1+Colombia">D1</a>
<a target="_blank" rel="noopener" href="https://www.google.com/search?q=${q}+precio+tiendas+Ara+Colombia">Ara</a>
<a target="_blank" rel="noopener" href="https://www.olimpica.com/${q}?_q=${q}&map=ft">Olímpica</a>
<a target="_blank" rel="noopener" href="https://www.google.com/search?q=${q}+precio+Colombia&tbm=shop">Comparar</a></div>`}

// ===== Header =====
function renderHeader(){
  const st=S.settings,sp=spent(),rem=st.budget-sp;
  $('#hB').textContent=money(st.budget);$('#hS').textContent=money(sp);$('#hR').textContent=money(rem);
  $('#hBar').style.width=Math.min(100,sp/st.budget*100)+'%';
  const dl=Math.max(0,daysBetween(today(),st.end)+1);
  $('#per').textContent=`hasta ${fdate(st.end)} · ${dl} días`;
  $('#prodlist').innerHTML=S.products.map(p=>`<option value="${esc(p.name)}">`).join('');
}

// ===== Tabs =====
let tab='lista';
const R={lista,gastos,precios,listas,cerebro};
function go(t){tab=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));render();scrollTo(0,0)}
function render(){save();renderHeader();$('#main').innerHTML=R[tab]()}
document.getElementById('nav').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.t)};

// ----- LISTA -----
function lista(){
  const pend=S.list.filter(i=>!i.done),done=S.list.filter(i=>i.done);
  const pe=pending(),rem=S.settings.budget-spent();
  const byCat={};pend.forEach(i=>{const c=prod(i.pid)?.cat||'otros';(byCat[c]=byCat[c]||[]).push(i)});
  let h=`<div class="card"><form class="row" onsubmit="addToList(event)">
    <input name="n" list="prodlist" placeholder="Agregar producto…" autocomplete="off" required>
    <input name="q" type="number" min="0.1" step="any" value="1" style="width:62px">
    <button class="p">＋</button></form>
    <div class="row" style="justify-content:space-between;margin-top:10px">
      <div><div class="mut">Falta por comprar (estimado)</div><div class="big">${money(pe)}</div></div>
      <div style="text-align:right"><div class="mut">Te quedaría</div><div class="big" style="color:${rem-pe<0?'var(--bad)':'var(--ok)'}">${money(rem-pe)}</div></div>
    </div></div>`;
  h+=`<div class="card"><h2>Por comprar <span class="mut">${pend.length} ítems</span></h2>`;
  if(!pend.length)h+=`<div class="empty">Lista vacía. Carga una lista en 📚 Listas.</div>`;
  for(const c of Object.keys(CATS))if(byCat[c]){
    h+=`<div class="cat">${CATS[c]}</div>`;
    byCat[c].sort((a,b)=>(prod(a.pid)?.prio||2)-(prod(b.pid)?.prio||2)).forEach(i=>{const p=prod(i.pid),src=estSrc(i.pid);
      h+=`<div class="it"><button class="ck" onclick="buy('${i.id}')" aria-label="Comprado"></button>
      <div class="n" onclick="editListItem('${i.id}')"><b>${esc(pname(i.pid))}</b><small>${i.qty} ${esc(p?.unit||'')} · ${PRIO[p?.prio||2]}${src==='ref'?' · precio ref.':''}</small></div>
      <span class="price">${money(est(i.pid)*i.qty)}</span></div>`})
  }
  h+=`</div>`;
  if(done.length){h+=`<div class="card"><details><summary>Comprados (${done.length})</summary>`;
    done.forEach(i=>{h+=`<div class="it done"><button class="ck" onclick="undo('${i.id}')">✓</button><div class="n"><b>${esc(pname(i.pid))}</b><small>${i.qty} · pagado ${money(i.paid||0)}</small></div></div>`});
    h+=`<div class="acts"><button class="sm" onclick="clearDone()">Quitar comprados de la lista</button></div></details></div>`}
  h+=`<div class="card"><div class="acts" style="margin:0;justify-content:space-between">
    <button onclick="saveAsTemplate()">💾 Guardar como lista</button><button class="g sm" onclick="clearList()">🗑 Vaciar lista</button></div></div>`;
  h+=`<div class="card"><details><summary>🏠 Despensa actual (${S.pantry.length})</summary>
    <p class="mut">Lo que ya tienes en casa. El Cerebro lo usa para sugerirte comidas y no repetir compras.</p>`;
  S.pantry.forEach(x=>{h+=`<div class="it"><div class="n"><b>${esc(x.name)}</b><small>${esc(x.qty)}</small></div><button class="g" onclick="delPantry('${x.id}')">✕</button></div>`});
  h+=`<form class="row" style="margin-top:8px" onsubmit="addPantry(event)"><input name="n" placeholder="Producto" required><input name="q" placeholder="Cant." style="width:90px"><button>＋</button></form></details></div>`;
  return h;
}
function addToList(e){e.preventDefault();const f=e.target,pid=ensureProduct(f.n.value);if(!pid)return;const q=parseFloat(f.q.value)||1;
  const ex=S.list.find(i=>i.pid===pid&&!i.done);if(ex)ex.qty+=q;else S.list.push({id:uid(),pid,qty:q,done:false});render();toast('Agregado');$('#main input[name=n]').focus()}
function editListItem(id){const i=S.list.find(x=>x.id===id),p=prod(i.pid);
  openDlg(`<h3>${esc(p.name)}</h3><label>Cantidad</label><input id="eq" type="number" step="any" value="${i.qty}">
  <label>Estimado</label><div>${money(est(i.pid))} c/u (${estSrc(i.pid)==='ref'?'precio de referencia':'último precio visto'})</div>
  <div class="acts"><button class="d" onclick="S.list=S.list.filter(x=>x.id!=='${id}');closeDlg();render()">Quitar</button>
  <button onclick="closeDlg();openProduct('${p.id}')">Ver precios</button>
  <button class="p" onclick="S.list.find(x=>x.id==='${id}').qty=parseFloat($('#eq').value)||1;closeDlg();render()">Guardar</button></div>`)}
function undo(id){const i=S.list.find(x=>x.id===id);i.done=false;render();toast('Vuelve a pendientes (el gasto queda registrado)')}
let lastList=null;
function clearList(){if(!confirm('¿Vaciar TODA la lista de compras?'))return;lastList=S.list;S.list=[];render();toastUndo('Lista vaciada')}
function clearDone(){lastList=S.list;S.list=S.list.filter(i=>!i.done);render();toastUndo('Comprados quitados')}
function undoList(){if(lastList){S.list=lastList;lastList=null;render();toast('Lista recuperada ✓')}}
function toastUndo(t){const e=$('#toast');e.innerHTML=esc(t)+' · <u>Deshacer</u>';e.style.pointerEvents='auto';e.onclick=()=>{e.classList.remove('on');undoList()};e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>{e.classList.remove('on');e.style.pointerEvents='none';e.onclick=null},6000)}
function addPantry(e){e.preventDefault();S.pantry.push({id:uid(),name:e.target.n.value,qty:e.target.q.value});render()}
function delPantry(id){S.pantry=S.pantry.filter(x=>x.id!==id);render()}

// ----- Diálogo de compra -----
function buy(listId,pidPre){
  const li=listId?S.list.find(x=>x.id===listId):null,pid=li?li.pid:pidPre,p=pid?prod(pid):null;
  const opts=S.settings.stores.map(s=>`<option ${s===S.settings.store?'selected':''}>${esc(s)}</option>`).join('');
  openDlg(`<h3>🛒 Registrar compra</h3>
  <label>Producto</label><input id="bN" list="prodlist" value="${esc(p?.name||'')}" ${li?'readonly':''} placeholder="¿Qué compraste?">
  <div class="grid2"><div><label>Cantidad</label><input id="bQ" type="number" step="any" min="0" value="${li?li.qty:1}" oninput="bTot()"></div>
  <div><label>Precio unitario</label><input id="bP" inputmode="numeric" value="${pid?est(pid):''}" oninput="bTot()"></div></div>
  <div class="grid2"><div><label>Tienda</label><select id="bS">${opts}</select></div><div><label>Fecha</label><input id="bD" type="date" value="${today()}"></div></div>

function gastos(){
  const ps=S.purchases.filter(p=>inPeriod(p.date)).sort((a,b)=>a.date<b.date?1:-1),tot=ps.reduce((a,p)=>a+p.total,0);
  const byC={},byS={};ps.forEach(p=>{const c=prod(p.pid)?.cat||'otros';byC[c]=(byC[c]||0)+p.total;byS[p.store]=(byS[p.store]||0)+p.total});
  let h=`<div class="card"><h2>Este periodo <span class="price">${money(tot)}</span></h2>
  <button class="p" style="width:100%" onclick="buy()">＋ Registrar gasto suelto</button></div>`;
  if(tot){h+=`<div class="card"><h2>¿En qué se va?</h2>`;
    Object.entries(byC).sort((a,b)=>b[1]-a[1]).forEach(([c,v])=>{h+=`<div style="margin:6px 0"><div class="row" style="justify-content:space-between"><span>${CATS[c]}</span><span class="price">${money(v)} · ${Math.round(v/tot*100)}%</span></div><div class="hb"><i style="width:${v/tot*100}%"></i></div></div>`});
    h+=`<div class="cat">Por tienda</div>`+Object.entries(byS).map(([s,v])=>`<span class="chip">${esc(s)}: ${money(v)}</span>`).join('')+`</div>`}

  let last='';ps.forEach(p=>{if(p.date!==last){h+=`<div class="cat">${fdate(p.date)}</div>`;last=p.date}
    h+=`<div class="it"><div class="n"><b>${esc(pname(p.pid))}</b><small>${p.qty} × ${money(p.price)} · ${esc(p.store)}</small></div><span class="price">${money(p.total)}</span><button class="g" onclick="delPurchase('${p.id}')">✕</button></div>`});
  const old=S.purchases.length-ps.length;if(old)h+=`<p class="mut">${old} compras de periodos anteriores siguen guardadas para el historial de precios.</p>`;
  return h+`</div>`;
}

  const rem=Math.max(0,S.settings.budget-spent());

function genList(){
  const budget=num($('#gB').value),res=+$('#gR').value,target=budget*(1-res/100);
  const has=n=>S.pantry.some(x=>slug(n).split('-').some(w=>w.length>3&&slug(x.name).includes(w)));
  const cand=S.products.filter(p=>est(p.id)>0).sort((a,b)=>a.prio-b.prio||est(a.id)-est(b.id));
  let total=0;const items=[],skipped=[];
  for(const p of cand){if(p.prio>1&&has(p.name))continue;const c=est(p.id);if(total+c<=target){items.push({pid:p.id,qty:1});total+=c}else if(p.prio<3)skipped.push(p.name)}
  gen={budget,total,items,skipped};S.settings.reserve=res;render()}
function useGen(){if(S.list.some(i=>!i.done)&&!confirm('¿Reemplazar tu lista actual?'))return;S.list=gen.items.map(i=>({id:uid(),pid:i.pid,qty:i.qty,done:false}));gen=null;go('lista');toast('Lista lista 😉')}

function saveAsTemplate(){const items=S.list.map(i=>({pid:i.pid,qty:i.qty}));if(!items.length)return toast('La lista está vacía');const n=prompt('Nombre para esta lista','Mi lista '+fdate(today()));if(!n)return;S.templates.push({id:uid(),name:n,items});render();toast('Lista guardada')}

const TIPS=[
 ['🥬','Frescos en la galería','Cebolla, tomate, cilantro y plátano suelen salir más baratos en la plaza o galería del barrio que en el supermercado. Compra solo lo de 4-5 días para que no se dañe.'],
 ['🍗','Pollo en porciones','Compra la bandeja, divídela en porciones de una comida y congélalas. Rinde más y no se pierde.'],
 ['⚖️','Compara por gramo','Un paquete más grande no siempre es más barato. Divide precio ÷ gramos antes de decidir.'],
 ['🏷️','Marcas propias','En D1 y Ara las marcas propias de aseo y granos suelen costar bastante menos que la marca conocida con calidad parecida.'],
 ['🧾','Nunca con hambre','Ve al mercado comido y con la lista; las compras por antojo son las que descuadran la quincena.'],
 ['🧅','Hogao de una vez','Haz hogao para 3-4 días y guárdalo en frasco en la nevera: te ahorra tiempo y gas.'],
 ['💧','El agua es primero','Una jarra con tapa y agua hervida o filtrada te ahorra comprar bebidas toda la quincena.']
];
function cerebro(){
  const st=S.settings,sp=spent(),rem=st.budget-sp,dl=Math.max(1,daysBetween(today(),st.end)+1),pe=pending(),resAmt=st.budget*st.reserve/100;
  const T=[];
  T.push(['📅','Ritmo de gasto',`Te quedan ${money(rem)} para ${dl} días: unos ${money(rem/dl)} por día.`]);
  if(sp+pe>st.budget)T.push(['🚨','La lista no cabe',`Lo pendiente (${money(pe)}) supera lo disponible. Quita productos “Si alcanza” o compra menos cantidad.`]);
  else if(sp+pe>st.budget-resAmt){const cut=S.list.filter(i=>!i.done&&prod(i.pid)?.prio===3).map(i=>pname(i.pid));T.push(['⚠️','Se come la reserva',`Si compras todo lo pendiente quedarías con ${money(rem-pe)}, menos que tu reserva de ${money(resAmt)}.${cut.length?' Puedes dejar para después: '+cut.join(', ')+'.':''}`])}
  else if(pe)T.push(['✅','Vas bien',`Con lo pendiente te sobrarían ${money(rem-pe)}. ¡Esa es la reserva para imprevistos!`]);
  // tiendas
  const wins={};let cmp=0;S.products.forEach(p=>{const os=st.stores.map(s=>latest(p.id,s)).filter(Boolean);if(os.length>1){cmp++;const b=os.reduce((a,o)=>o.price<a.price?o:a);wins[b.store]=(wins[b.store]||0)+1}});
  if(cmp){const w=Object.entries(wins).sort((a,b)=>b[1]-a[1])[0];T.push(['🏪','Tienda más barata',`${w[0]} fue la más barata en ${w[1]} de ${cmp} productos que has comparado.`])}
  else T.push(['🏪','Compara tiendas','Anota el precio de un mismo producto en D1, Ara u Olímpica (pestaña Precios) y aquí te diré cuál te conviene.']);
  // alzas
  const ups=[];S.products.forEach(p=>{const o=obsOf(p.id);if(o.length>1&&o[0].price>o[1].price*1.1)ups.push(`${p.name} (+${Math.round((o[0].price/o[1].price-1)*100)}%)`)});
  if(ups.length)T.push(['📈','Subieron de precio',ups.slice(0,5).join(', ')]);
  // canasta
  const bt=S.templates.find(t=>t.id===st.basket);
  if(bt){const now=tplTotal(bt),ref=bt.items.reduce((a,i)=>{const p=prod(i.pid);return a+(p?(p.ref.min+p.ref.max)/2*i.qty:0)},0);
    const per=st.stores.map(s=>{let tot=0,ok=0;bt.items.forEach(i=>{const o=latest(i.pid,s);if(o){tot+=o.price*i.qty;ok++}});return[s,tot,ok]}).filter(x=>x[2]);
    T.push(['🧺',`Tu canasta “${bt.name}”`,`Hoy cuesta aprox. ${money(now)} (con precios de referencia era ${money(ref)}; ${now>ref?'subió '+money(now-ref):'bajó '+money(ref-now)}).${per.length?' Por tienda: '+per.map(([s,t,ok])=>`${s} ${money(t)} (${ok}/${bt.items.length} prod.)`).join(' · '):''}`])}
  // menú
  const pan=S.pantry.map(x=>slug(x.name)).join(' '),has=w=>pan.includes(w),M=[];
  if(has('lenteja'))M.push('Lentejas guisadas con hogao, zanahoria y papa, con arroz');
  if(has('huevo'))M.push('Huevos pericos con arepa');
  if(has('pasta')||has('espagueti'))M.push('Pasta con tomate y ajo');
  if(has('avena'))M.push('Avena cocida con leche y panela');
  if(has('papa')&&has('huevo'))M.push('Tortilla de papa');
  if(M.length)T.push(['🍲','Cocina con lo que tienes',M.join(' · ')]);
  const tip=TIPS[new Date().getDate()%TIPS.length];T.push(tip);
  let h=`<div class="card"><h2>🧠 Lo que veo</h2>${T.map(([e,t,p])=>`<div class="tip"><div class="e">${e}</div><div><b>${esc(t)}</b><p>${esc(p)}</p></div></div>`).join('')}</div>`;
  h+=`<div class="card"><h2>🤖 Pregúntale a una IA</h2><p class="mut" style="margin-top:0">Copia todo tu contexto (presupuesto, lista, precios, despensa) y pégalo en Claude o en tu proyecto “Mercado Mensual” para un consejo personalizado.</p>
  <div class="acts" style="justify-content:stretch"><button class="p" style="flex:1" onclick="copyCtx()">📋 Copiar contexto</button>${navigator.share?`<button onclick="shareCtx()">Compartir</button>`:''}</div></div>`;
  h+=`<div class="card"><h2>⚙️ Ajustes del periodo</h2>
  <div class="grid2"><div><label>Presupuesto</label><input id="sB" inputmode="numeric" value="${st.budget}"></div><div><label>Reserva %</label><input id="sR" type="number" value="${st.reserve}"></div>
  <div><label>Desde</label><input id="sS" type="date" value="${st.start}"></div><div><label>Hasta</label><input id="sE" type="date" value="${st.end}"></div>
  <div><label>Tienda habitual</label><select id="sT">${st.stores.map(s=>`<option ${s===st.store?'selected':''}>${esc(s)}</option>`).join('')}</select></div>
  <div><label>Tiendas (separadas por coma)</label><input id="sL" value="${esc(st.stores.join(', '))}"></div></div>
  <div class="acts"><button onclick="newPeriod()">🔄 Nueva quincena</button><button class="p" onclick="saveSettings()">Guardar</button></div></div>`;
  h+=`<div class="card"><h2>💾 Copia de seguridad</h2><p class="mut" style="margin-top:0">Todo vive solo en este dispositivo. Descarga una copia de vez en cuando.</p>
  <div class="acts" style="justify-content:flex-start"><button onclick="exportData()">Descargar copia</button><button onclick="$('#imp').click()">Restaurar copia</button><button class="d" onclick="resetAll()">Borrar todo</button></div>
  <input id="imp" type="file" accept=".json,application/json" hidden onchange="importData(this.files[0])"></div>`;
  return h;
}

  st.stores=$('#sL').value.split(',').map(s=>s.trim()).filter(Boolean);st.store=st.stores.includes($('#sT').value)?$('#sT').value:st.stores[0];render();toast('Ajustes guardados')}
function newPeriod(){const b=prompt('Presupuesto para la nueva quincena',S.settings.budget);if(b===null)return;S.settings.budget=num(b)||S.settings.budget;S.settings.start=today();S.settings.end=addDays(today(),14);S.list=S.list.filter(i=>!i.done);render();toast('Nueva quincena iniciada')}
function ctxText(){const st=S.settings,sp=spent();
  const lines=[`Soy de Pereira, Colombia. Gestiono mi mercado con este contexto (moneda COP):`,
  `Presupuesto: ${money(st.budget)} del ${st.start} al ${st.end}. Gastado: ${money(sp)}. Disponible: ${money(st.budget-sp)}. Reserva deseada: ${st.reserve}%. Tienda habitual: ${st.store}.`,
  `\nLista pendiente:`,...S.list.filter(i=>!i.done).map(i=>`- ${pname(i.pid)} x${i.qty} (aprox. ${money(est(i.pid)*i.qty)})`),
  `\nCompras del periodo:`,...S.purchases.filter(p=>inPeriod(p.date)).map(p=>`- ${p.date} ${pname(p.pid)} x${p.qty} a ${money(p.price)} en ${p.store}`),
  `\nÚltimos precios vistos:`,...S.products.filter(p=>obsOf(p.id).length).map(p=>`- ${p.name}: `+st.stores.map(s=>{const o=latest(p.id,s);return o?`${s} ${money(o.price)} (${o.date})`:null}).filter(Boolean).join(', ')),
  `\nDespensa: ${S.pantry.map(x=>`${x.name} (${x.qty})`).join(', ')}`,
  `\nAyúdame a: optimizar la lista para que alcance, sugerir dónde comprar cada cosa y un menú económico con lo que tengo.`];
  return lines.join('\n')}
function copyCtx(){navigator.clipboard.writeText(ctxText()).then(()=>toast('Contexto copiado ✓'),()=>{openDlg(`<h3>Copia este texto</h3><textarea rows="12">${esc(ctxText())}</textarea><div class="acts"><button class="p" onclick="closeDlg()">Cerrar</button></div>`)})}
function shareCtx(){navigator.share({title:'Mi mercado',text:ctxText()}).catch(()=>{})}
function exportData(){const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`mi-mercado-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function importData(f){if(!f)return;f.text().then(t=>{const d=JSON.parse(t);if(!d.version||!d.products)throw 0;S=d;render();toast('Copia restaurada')}).catch(()=>toast('Archivo no válido'))}
function resetAll(){if(confirm('¿Borrar TODOS los datos y volver al inicio?')){S=seed();render()}}

// ===== Diálogo =====
function openDlg(h){$('#dlgIn').innerHTML=h;const d=$('#dlg');if(!d.open)d.showModal()}
function closeDlg(){$('#dlg').close()}
$('#dlg').addEventListener('click',e=>{if(e.target.id==='dlg')closeDlg()});

go('lista');
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
