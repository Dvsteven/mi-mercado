<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi Mercado</title>
<meta name="theme-color" content="#2f6b4f">
<meta name="description" content="Lista de compras, registro de precios y presupuesto de mercado">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f7f3ea;--card:#fffdf8;--ink:#2b2a26;--mut:#7a756a;--line:#e7e0d1;--pri:#2f6b4f;--pri2:#e4efe8;--warn:#b5651d;--warn2:#fbeee0;--bad:#b23b3b;--bad2:#f8e3e3;--ok:#2f7a3e}
@media (prefers-color-scheme:dark){:root{--bg:#171a17;--card:#202520;--ink:#ecebe5;--mut:#a3a397;--line:#323a32;--pri:#7cc59b;--pri2:#24392c;--warn:#e7a35f;--warn2:#3b2e20;--bad:#ee8a8a;--bad2:#3d2424;--ok:#7cc59b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{background:var(--pri);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 14px;position:sticky;top:0;z-index:5}
@media (prefers-color-scheme:dark){header{background:#1f3a2b}}
header h1{margin:0;font-size:17px;font-weight:650;display:flex;justify-content:space-between;align-items:center}
header small{opacity:.85;font-weight:400;font-size:12px}
.bud{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.bud div{background:rgba(255,255,255,.12);border-radius:10px;padding:6px 8px}
.bud b{display:block;font-size:15px}.bud span{font-size:11px;opacity:.85}
.bar{height:6px;background:rgba(255,255,255,.2);border-radius:4px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:4px}
main{padding:12px 16px;max-width:680px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
input,select,button,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
button{border:0;border-radius:10px;padding:9px 12px;background:var(--pri2);color:var(--pri);font-weight:600;cursor:pointer;white-space:nowrap}
button.p{background:var(--pri);color:#fff}
@media (prefers-color-scheme:dark){button.p{color:#10241a}}
button.g{background:transparent;color:var(--mut);padding:6px 8px}
button.d{background:var(--bad2);color:var(--bad)}
button.sm{padding:5px 9px;font-size:13px}
.it{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.it:first-of-type{border-top:0}
.it .n{flex:1;min-width:0}.it .n b{font-weight:550;display:block;overflow:hidden;text-overflow:ellipsis}
.it .n small,.mut{color:var(--mut);font-size:12.5px}
.it.done .n b{text-decoration:line-through;color:var(--mut)}
.ck{width:24px;height:24px;border-radius:7px;border:2px solid var(--pri);flex:none;display:grid;place-items:center;background:none;padding:0}
.done .ck{background:var(--pri);color:#fff}
.cat{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 2px}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:var(--pri2);color:var(--pri);margin:2px 4px 0 0}
.chip.w{background:var(--warn2);color:var(--warn)}.chip.b{background:var(--bad2);color:var(--bad)}
.price{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:8px 0 9px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px;line-height:1}
nav button.on{color:var(--pri)}
dialog{border:0;border-radius:18px;padding:0;width:min(94vw,460px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .in{padding:16px}
dialog h3{margin:0 0 12px;font-size:17px}
label{display:block;font-size:12.5px;color:var(--mut);margin:8px 0 3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.tip{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.tip:first-of-type{border-top:0}
.tip .e{font-size:22px;line-height:1.1}
.tip p{margin:2px 0 0;color:var(--mut);font-size:13.5px}
.hb{height:8px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:3px}.hb i{display:block;height:100%;background:var(--pri)}
table{width:100%;border-collapse:collapse;font-size:13.5px}td,th{padding:5px 4px;border-top:1px solid var(--line);text-align:left}th{color:var(--mut);font-weight:600;font-size:12px}
.links{display:flex;gap:6px;flex-wrap:wrap}.links a{text-decoration:none;font-size:13px;padding:6px 10px;border-radius:9px;background:var(--warn2);color:var(--warn);font-weight:600}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:20}
#toast.on{opacity:1}
details summary{cursor:pointer;font-weight:600;color:var(--pri);padding:4px 0}
.big{font-size:22px;font-weight:700}
.empty{color:var(--mut);text-align:center;padding:16px 0;font-size:14px}
</style>
</head>
<body>
<header>
  <h1>🧺 Mi Mercado <small id="per"></small></h1>
  <div class="bud">
    <div><b id="hB"></b><span>Presupuesto</span></div>
    <div><b id="hS"></b><span>Gastado</span></div>
    <div><b id="hR"></b><span>Disponible</span></div>
  </div>
  <div class="bar"><i id="hBar"></i></div>
</header>
<main id="main"></main>
<nav id="nav">
  <button data-t="lista"><span>📝</span>Lista</button>
  <button data-t="gastos"><span>🧾</span>Gastos</button>
  <button data-t="precios"><span>🏷️</span>Precios</button>
  <button data-t="listas"><span>📚</span>Listas</button>
  <button data-t="cerebro"><span>🧠</span>Cerebro</button>
</nav>
<datalist id="prodlist"></datalist>

<dialog id="dlg"><div class="in" id="dlgIn"></div></dialog>
<div id="toast"></div>

<script>
// ===== Utilidades =====
const KEY='mimercado.v1';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Math.round(n||0).toLocaleString('es-CO');
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
const fdate=s=>new Date(s+'T12:00:00').toLocaleDateString('es-CO',{day:'numeric',month:'short'});
const slug=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const num=v=>{const n=parseFloat(String(v).replace(/[^\d.,]/g,'').replace(/\./g,'').replace(',','.'));return isNaN(n)?0:n};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1900)}

const CATS={aseo:'🧼 Aseo y hogar',frescos:'🥬 Aliños y frescos',proteinas:'🍗 Proteínas',granos:'🍚 Granos y despensa',lacteos:'🥛 Lácteos y huevos',otros:'🛍️ Otros'};
const PRIO={1:'Esencial',2:'Importante',3:'Si alcanza'};

// ===== Datos iniciales (del Plan de Mercado) =====
function seed(){
  const P=(name,cat,min,max,prio,unit)=>({id:slug(name),name,cat,ref:{min,max:max||min},prio,unit:unit||'und'});
  const products=[
    P('Lavaplatos líquido','aseo',3500,4500,1),P('Esponjas para loza','aseo',1500,2000,1),
    P('Papel higiénico x4-6','aseo',6000,8000,1,'paq'),P('Jabón de cuerpo','aseo',3000,4500,1),
    P('Crema de dientes','aseo',4000,5500,1),P('Máquinas de afeitar','aseo',4000,7000,2,'paq'),
    P('Jarra para agua con tapa','aseo',6000,10000,2),P('Ambientador','aseo',4000,6000,3),
    P('Detergente ropa','aseo',7000,9500,2,'bolsa'),
    P('Cebolla larga y cabezona','frescos',4000,4000,1),P('Tomate maduro','frescos',4000,4000,1,'lb'),
    P('Ajo (cabeza o pasta)','frescos',2000,2000,1),P('Cilantro','frescos',1000,1000,2,'atado'),
    P('Plátanos','frescos',4000,4000,2),P('Aceite repuesto','granos',4500,4500,1,'bolsa'),
    P('Arroz','granos',4000,5000,1,'lb'),P('Lentejas','granos',3500,4500,2,'lb'),
    P('Fríjol','granos',5500,7000,3,'lb'),P('Pasta / espagueti','granos',2500,3500,2,'paq'),
    P('Avena en hojuelas','granos',3500,5000,2,'bolsa'),P('Panela','granos',2000,3000,2),
    P('Azúcar','granos',2800,3500,3,'lb'),P('Café','granos',8000,12000,3,'paq'),
    P('Atún en lata','proteinas',5000,6500,3,'lata'),
    P('Pollo (pechuga o muslos)','proteinas',18000,24000,2,'bandeja'),P('Queso / cuajada','lacteos',6000,8000,3),
    P('Arepas','granos',3000,4500,2,'paq'),P('Huevos x30','lacteos',15000,19000,2,'panal'),
    P('Leche bolsa','lacteos',4000,5000,2,'bolsa')
  ];
  const plan=['lavaplatos-liquido','esponjas-para-loza','papel-higienico-x4-6','jabon-de-cuerpo','crema-de-dientes','maquinas-de-afeitar','jarra-para-agua-con-tapa','ambientador','cebolla-larga-y-cabezona','tomate-maduro','ajo-cabeza-o-pasta','cilantro','aceite-repuesto','arroz','pollo-pechuga-o-muslos','queso-cuajada','arepas','platanos'];
  const tplPlan={id:'plan-nov',name:'Plan quincena (archivo)',items:plan.map(p=>({pid:p,qty:1}))};
  const tplAseo={id:'aseo',name:'Solo aseo urgente',items:plan.slice(0,6).map(p=>({pid:p,qty:1}))};
  return {version:1,
    settings:{budget:150000,start:today(),end:'2026-11-15',reserve:30,store:'D1',stores:['D1','Ara','Olímpica','Tienda del barrio','Galería/Plaza','Otra'],basket:'plan-nov'},
    products,
    list:plan.map(p=>({id:uid(),pid:p,qty:1,done:false})),
    purchases:[],prices:[],
    templates:[tplPlan,tplAseo],
    pantry:[{id:uid(),name:'Huevos',qty:'28'},{id:uid(),name:'Leche',qty:'3 bolsas'},{id:uid(),name:'Lentejas',qty:'2 lb'},{id:uid(),name:'Arroz',qty:'1 lb'},{id:uid(),name:'Espaguetis / pastas',qty:'algo'},{id:uid(),name:'Avena en hojuelas',qty:'algo'},{id:uid(),name:'Papas amarillas',qty:'1 bolsa'},{id:uid(),name:'Aceite',qty:'tarrito'},{id:uid(),name:'Sal',qty:'1 lb'},{id:uid(),name:'Panela',qty:'1'},{id:uid(),name:'Zanahoria',qty:'1'}]
  };
}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.version)return s}catch(e){}return seed()}
let S=load();
if(!S.settings.stores.some(x=>/barrio/i.test(x)))S.settings.stores.splice(Math.max(0,S.settings.stores.indexOf('Otra')),0,'Tienda del barrio');
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('⚠️ No se pudo guardar')}}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});

// ===== Lógica de precios =====
const prod=id=>S.products.find(p=>p.id===id);
const pname=id=>prod(id)?.name||id;
const obsOf=(pid,store)=>S.prices.filter(o=>o.pid===pid&&(!store||o.store===store)).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(b.ts||0)-(a.ts||0));
const latest=(pid,store)=>obsOf(pid,store)[0];
function est(pid){const o=latest(pid,S.settings.store)||latest(pid);if(o)return o.price;const p=prod(pid);return p?Math.round((p.ref.min+p.ref.max)/2):0}
const estSrc=pid=>latest(pid,S.settings.store)?'obs':latest(pid)?'otra':'ref';
const byName=n=>{const k=slug(n||'');return k?(S.products.find(p=>slug(p.name)===k)||prod(k)):null};
function ensureProduct(name,cat){const f=byName(name);if(f)return f.id;let id=slug(name);if(!id)return null;if(prod(id))id+='-'+uid().slice(0,3);if(!prod(id))S.products.push({id,name:name.trim(),cat:cat||'otros',ref:{min:0,max:0},prio:2,unit:'und'});return id}
function inPeriod(d){return d>=S.settings.start&&d<=S.settings.end}
function spent(){return S.purchases.filter(p=>inPeriod(p.date)).reduce((a,p)=>a+p.total,0)}
function pending(){return S.list.filter(i=>!i.done).reduce((a,i)=>a+est(i.pid)*i.qty,0)}
function storeLinks(name){const q=encodeURIComponent(name);return `<div class="links">
<a target="_blank" rel="noopener" href="https://www.google.com/search?q=${q}+precio+tiendas+D1+Colombia">D1</a>
<a target="_blank" rel="noopener" href="https://www.google.com/search?q=${q}+precio+tiendas+Ara+Colombia">Ara</a>
<a target="_blank" rel="noopener" href="https://www.olimpica.com/${q}?_q=${q}&map=ft">Olímpica</a>
<a target="_blank" rel="noopener" href="https://www.google.com/search?q=${q}+precio+Colombia&tbm=shop">Comparar</a></div>`}

// ===== Header =====
function renderHeader(){
  const st=S.settings,sp=spent(),rem=st.budget-sp;
  $('#hB').textContent=money(st.budget);$('#hS').textContent=money(sp);$('#hR').textContent=money(rem);
  $('#hBar').style.width=Math.min(100,sp/st.budget*100)+'%';
  const dl=Math.max(0,daysBetween(today(),st.end)+1);
  $('#per').textContent=`hasta ${fdate(st.end)} · ${dl} días`;
  $('#prodlist').innerHTML=S.products.map(p=>`<option value="${esc(p.name)}">`).join('');
}

// ===== Tabs =====
let tab='lista';
const R={lista,gastos,precios,listas,cerebro};
function go(t){tab=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));render();scrollTo(0,0)}
function render(){save();renderHeader();$('#main').innerHTML=R[tab]()}
document.getElementById('nav').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.t)};

// ----- LISTA -----
function lista(){
  const pend=S.list.filter(i=>!i.done),done=S.list.filter(i=>i.done);
  const pe=pending(),rem=S.settings.budget-spent();
  const byCat={};pend.forEach(i=>{const c=prod(i.pid)?.cat||'otros';(byCat[c]=byCat[c]||[]).push(i)});
  let h=`<div class="card"><div class="row"><span class="mut" style="white-space:nowrap">🏪 Comprando en</span>
    <select onchange="S.settings.store=this.value;render()">${S.settings.stores.map(s=>`<option ${s===S.settings.store?'selected':''}>${esc(s)}</option>`).join('')}</select></div>
    <div class="row" style="margin-top:8px"><button style="flex:1" onclick="openScan()">📷 Escanear código</button><button style="flex:1" onclick="openReceipt()">🧾 Importar factura</button></div></div>
  <div class="card"><form class="row" onsubmit="addToList(event)">
    <input name="n" list="prodlist" placeholder="Agregar producto…" autocomplete="off" required>
    <input name="q" type="number" min="0.1" step="any" value="1" style="width:62px">
    <button class="p">＋</button></form>
    <div class="row" style="justify-content:space-between;margin-top:10px">
      <div><div class="mut">Falta por comprar (estimado)</div><div class="big">${money(pe)}</div></div>
      <div style="text-align:right"><div class="mut">Te quedaría</div><div class="big" style="color:${rem-pe<0?'var(--bad)':'var(--ok)'}">${money(rem-pe)}</div></div>
    </div></div>`;
  h+=`<div class="card"><h2>Por comprar <span class="mut">${pend.length} ítems</span></h2>`;
  if(!pend.length)h+=`<div class="empty">Lista vacía. Carga una lista en 📚 Listas.</div>`;
  for(const c of Object.keys(CATS))if(byCat[c]){
    h+=`<div class="cat">${CATS[c]}</div>`;
    byCat[c].sort((a,b)=>(prod(a.pid)?.prio||2)-(prod(b.pid)?.prio||2)).forEach(i=>{const p=prod(i.pid),src=estSrc(i.pid);
      h+=`<div class="it"><button class="ck" onclick="buy('${i.id}')" aria-label="Comprado"></button>
      <div class="n" onclick="editListItem('${i.id}')"><b>${esc(pname(i.pid))}</b><small>${i.qty} ${esc(p?.unit||'')} · ${PRIO[p?.prio||2]}${src==='ref'?' · precio ref.':''}</small></div>
      <span class="price">${money(est(i.pid)*i.qty)}</span></div>`})
  }
  h+=`</div>`;
  if(done.length){h+=`<div class="card"><details><summary>Comprados (${done.length})</summary>`;
    done.forEach(i=>{h+=`<div class="it done"><button class="ck" onclick="undo('${i.id}')">✓</button><div class="n"><b>${esc(pname(i.pid))}</b><small>${i.qty} · pagado ${money(i.paid||0)}</small></div></div>`});
    h+=`<div class="acts"><button class="sm" onclick="clearDone()">Quitar comprados de la lista</button></div></details></div>`}
  h+=`<div class="card"><div class="acts" style="margin:0;justify-content:space-between">
    <button onclick="saveAsTemplate()">💾 Guardar como lista</button><button class="g sm" onclick="clearList()">🗑 Vaciar lista</button></div></div>`;
  h+=`<div class="card"><details><summary>🏠 Despensa actual (${S.pantry.length})</summary>
    <p class="mut">Lo que ya tienes en casa. El Cerebro lo usa para sugerirte comidas y no repetir compras.</p>`;
  S.pantry.forEach(x=>{h+=`<div class="it"><div class="n"><b>${esc(x.name)}</b><small>${esc(x.qty)}</small></div><button class="g" onclick="delPantry('${x.id}')">✕</button></div>`});
  h+=`<form class="row" style="margin-top:8px" onsubmit="addPantry(event)"><input name="n" placeholder="Producto" required><input name="q" placeholder="Cant." style="width:90px"><button>＋</button></form></details></div>`;
  return h;
}
function addToList(e){e.preventDefault();const f=e.target,pid=ensureProduct(f.n.value);if(!pid)return;const q=parseFloat(f.q.value)||1;
  const ex=S.list.find(i=>i.pid===pid&&!i.done);if(ex)ex.qty+=q;else S.list.push({id:uid(),pid,qty:q,done:false});render();toast('Agregado');$('#main input[name=n]').focus()}
function editListItem(id){const i=S.list.find(x=>x.id===id),p=prod(i.pid);
  openDlg(`<h3>${esc(p.name)}</h3><label>Cantidad</label><input id="eq" type="number" step="any" value="${i.qty}">
  <label>Estimado</label><div>${money(est(i.pid))} c/u (${estSrc(i.pid)==='ref'?'precio de referencia':'último precio visto'})</div>
  <div class="acts"><button class="d" onclick="S.list=S.list.filter(x=>x.id!=='${id}');closeDlg();render()">Quitar</button>
  <button onclick="closeDlg();openProduct('${p.id}')">Ver precios</button>
  <button class="p" onclick="S.list.find(x=>x.id==='${id}').qty=parseFloat($('#eq').value)||1;closeDlg();render()">Guardar</button></div>`)}
function undo(id){const i=S.list.find(x=>x.id===id);i.done=false;render();toast('Vuelve a pendientes (el gasto queda registrado)')}
let lastList=null;
function clearList(){if(!confirm('¿Vaciar TODA la lista de compras?'))return;lastList=S.list;S.list=[];render();toastUndo('Lista vaciada')}
function clearDone(){lastList=S.list;S.list=S.list.filter(i=>!i.done);render();toastUndo('Comprados quitados')}
function undoList(){if(lastList){S.list=lastList;lastList=null;render();toast('Lista recuperada ✓')}}
function toastUndo(t){const e=$('#toast');e.innerHTML=esc(t)+' · <u>Deshacer</u>';e.style.pointerEvents='auto';e.onclick=()=>{e.classList.remove('on');undoList()};e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>{e.classList.remove('on');e.style.pointerEvents='none';e.onclick=null},6000)}
function addPantry(e){e.preventDefault();S.pantry.push({id:uid(),name:e.target.n.value,qty:e.target.q.value});render()}
function delPantry(id){S.pantry=S.pantry.filter(x=>x.id!==id);render()}

// ----- Diálogo de compra -----
function buy(listId,pidPre,editId,code){
  const pu=editId?S.purchases.find(x=>x.id===editId):null;
  const li=listId?S.list.find(x=>x.id===listId):null,pid=pu?pu.pid:li?li.pid:pidPre,p=pid?prod(pid):null;
  const st=pu?pu.store:S.settings.store;
  const opts=S.settings.stores.map(s=>`<option ${s===st?'selected':''}>${esc(s)}</option>`).join('');
  openDlg(`<h3>${pu?'✏️ Editar compra':'🛒 Registrar compra'}</h3>
  <label>Producto</label><input id="bN" list="prodlist" value="${esc(p?.name||'')}" ${li?'readonly':''} placeholder="¿Qué compraste?" onchange="bFill()">
  <div class="grid2"><div><label>Marca</label><input id="bBr" value="${esc(p?.brand||'')}" placeholder="Opcional"></div>
  <div><label>Presentación</label><input id="bSz" value="${esc(p?.size||'')}" placeholder="500 g, 1 L, x4…"></div></div>
  <p class="mut" id="bH" style="margin:8px 0 0">${p&&!pu&&lastBuy(p.id)?`💡 La última vez: ${lastBuy(p.id).qty} × ${money(lastBuy(p.id).price)} en ${esc(lastBuy(p.id).store)}`:''}</p>
  <div class="grid2"><div><label>Cantidad (unidades)</label><input id="bQ" type="number" step="any" min="0" value="${pu?pu.qty:li?li.qty:(p&&lastBuy(p.id)?lastBuy(p.id).qty:1)}" oninput="bTot()"></div>
  <div><label>Precio</label><input id="bP" inputmode="numeric" value="${pu?(pu.noPrice?'':pu.price):pid?est(pid):''}" oninput="bTot()" placeholder="Si no lo ves, déjalo vacío"></div></div>
  <div class="row" style="margin-top:6px;gap:6px"><span class="mut" style="font-size:12.5px">El precio es</span>
  <button type="button" class="sm" id="bM1" onclick="bMode('u')">por unidad</button><button type="button" class="sm" id="bM2" onclick="bMode('t')">el total pagado</button></div>
  <div class="grid2"><div><label>Tienda</label><select id="bS">${opts}</select></div><div><label>Fecha</label><input id="bD" type="date" value="${pu?pu.date:today()}"></div></div>
  <label>Categoría</label><select id="bC">${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${p&&p.cat===k?'selected':''}>${v}</option>`).join('')}</select>
  <input type="hidden" id="bCode" value="${esc(code||'')}">
  <p class="row" style="justify-content:space-between;margin:12px 0 0"><span class="mut" id="bU"></span><span class="big" id="bT"></span></p><p class="mut" id="bX" style="margin:2px 0 0;text-align:right"></p>
  <div class="acts">${pu?`<button class="d" onclick="closeDlg();delPurchase('${pu.id}')">Borrar</button>`:''}<button class="g" onclick="closeDlg()">Cancelar</button><button class="p" onclick="saveBuy('${listId||''}','${editId||''}')">Guardar</button></div>`);bModeV=(p&&p.priceMode)||'u';bMode(bModeV);
  if(!li&&!pu&&!p)setTimeout(()=>$('#bN').focus(),50)
}
function bFill(){const p=byName($('#bN').value);if(!p)return;$('#bBr').value=p.brand||'';$('#bSz').value=p.size||'';$('#bC').value=p.cat;
  const lb=lastBuy(p.id);if(lb){$('#bH').textContent=`💡 La última vez: ${lb.qty} × ${money(lb.price)} en ${lb.store}`;$('#bQ').value=lb.qty}
  if(!num($('#bP').value))$('#bP').value=est(p.id);bMode(p.priceMode||'u')}
let bModeV='u';
function bMode(m){bModeV=m;$('#bM1').className='sm'+(m==='u'?' p':'');$('#bM2').className='sm'+(m==='t'?' p':'');bTot()}
function bCalc(){const pr=num($('#bP').value),q=parseFloat($('#bQ').value)||1;return bModeV==='t'?{unit:Math.round(pr/q),total:Math.round(pr)}:{unit:pr,total:Math.round(pr*q)}}
function bTot(){const q=parseFloat($('#bQ').value)||1,{unit,total}=bCalc();$('#bT').textContent=unit?money(total):'Sin precio';
  $('#bX').textContent=unit&&q!==1?`${q} × ${money(unit)} c/u`:'';const u=unitPrice(unit,$('#bSz').value);$('#bU').textContent=u||'Total'}
const lastBuy=pid=>S.purchases.filter(x=>x.pid===pid&&!x.noPrice).sort((a,b)=>(b.ts||0)-(a.ts||0))[0];
function saveBuy(listId,editId){
  const name=$('#bN').value.trim();if(!name)return toast('Escribe el producto');
  const pid=ensureProduct(name,$('#bC').value),p=prod(pid),qty=parseFloat($('#bQ').value)||1,{unit:price}=bCalc(),store=$('#bS').value,date=$('#bD').value||today(),noPrice=!price;
  if(noPrice&&!confirm('¿Guardar sin precio? Quedará marcado ⚠️ y se completa al importar la factura.'))return;
  p.priceMode=bModeV;
  p.cat=$('#bC').value;p.brand=$('#bBr').value.trim();p.size=$('#bSz').value.trim();
  const code=$('#bCode').value;if(code){p.codes=p.codes||[];if(!p.codes.includes(code))p.codes.push(code)}
  if(editId){const pu=S.purchases.find(x=>x.id===editId);Object.assign(pu,{pid,qty,price,total:Math.round(price*qty),store,date,noPrice});
    S.prices=S.prices.filter(x=>x.purchase!==editId);if(!noPrice)S.prices.push({id:uid(),pid,store,price,date,ts:pu.ts||Date.now(),src:'compra',purchase:editId});
    const li=S.list.find(i=>i.pid===pid&&i.done);if(li)li.paid=pu.total;
    closeDlg();render();return toast('Compra corregida ✓')}
  const dup=S.purchases.find(x=>x.pid===pid&&x.date===date&&Date.now()-(x.ts||0)<3*36e5);
  if(dup&&!confirm(`Ya registraste ${p.name} hoy (${dup.qty} × ${money(dup.price)} en ${dup.store}). ¿Registrar OTRA compra igual?\n\nSi querías corregirla, cancela y edítala en 🧾 Gastos.`))return;
  const id=uid();
  S.purchases.push({id,pid,qty,price,total:Math.round(price*qty),store,date,ts:Date.now(),noPrice});
  if(!noPrice)S.prices.push({id:uid(),pid,store,price,date,ts:Date.now(),src:'compra',purchase:id});
  const li=listId?S.list.find(x=>x.id===listId):S.list.find(i=>i.pid===pid&&!i.done);
  if(li){li.done=true;li.paid=Math.round(price*qty)}
  closeDlg();render();toast('Compra registrada ✓')
}

// ----- Presentación y precio por unidad -----
function parseSize(t){t=String(t||'').toLowerCase().replace(',','.');let m=t.match(/([\d.]+)\s*(kg|g|gr|l|lt|ml|cc)\b/);
  if(m){let q=parseFloat(m[1]),u=m[2];if(u==='kg'){q*=1000;u='g'}if(u==='gr')u='g';if(u==='l'||u==='lt'){q*=1000;u='ml'}if(u==='cc')u='ml';return q?{q,u}:null}
  m=t.match(/x\s*(\d+)/);if(m)return{q:+m[1],u:'und'};return null}
function unitPrice(price,size){const z=parseSize(size);if(!z||!price)return'';
  if(z.u==='und')return money(price/z.q)+' c/u';const per=z.u==='g'?(z.q>=500?1000:100):(z.q>=500?1000:100);
  return money(price/z.q*per)+' por '+(per===1000?(z.u==='g'?'kg':'litro'):(z.u==='g'?'100 g':'100 ml'))}

// ----- Escáner de códigos de barras -----
let scanStream=null,scanTimer=null;
async function openScan(){
  openDlg(`<h3>📷 Escanear código</h3><video id="scV" playsinline muted style="width:100%;border-radius:12px;background:#000;aspect-ratio:4/3;object-fit:cover"></video>
  <p class="mut" id="scM">Apunta al código de barras del producto…</p>
  <label>¿No lee? Escribe el número</label><div class="row"><input id="scC" inputmode="numeric" placeholder="7702…"><button class="p" onclick="gotCode($('#scC').value.trim())">Buscar</button></div>
  <div class="acts"><button class="g" onclick="stopScan();closeDlg()">Cerrar</button></div>`);
  if(!('BarcodeDetector' in window)){$('#scM').textContent='Este navegador no tiene lector integrado. Usa Chrome en Android o escribe el número.';return}
  try{const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']});
    scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=$('#scV');v.srcObject=scanStream;await v.play();
    const loop=async()=>{if(!scanStream)return;try{const r=await det.detect(v);if(r.length){navigator.vibrate&&navigator.vibrate(80);return gotCode(r[0].rawValue)}}catch(e){}scanTimer=setTimeout(loop,250)};loop()
  }catch(e){$('#scM').textContent='No pude abrir la cámara: '+e.message}
}
function stopScan(){clearTimeout(scanTimer);if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}}
$('#dlg').addEventListener('close',stopScan);
const byCode=c=>S.products.find(p=>(p.codes||[]).includes(c));
async function gotCode(c){if(!c)return;stopScan();const p=byCode(c);if(p){closeDlg();return buy(null,p.id,null,c)}
  $('#scM').textContent='Código '+c+' nuevo. Buscando en Open Food Facts…';
  let info=null;try{const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${c}.json?fields=product_name,brands,quantity`);const j=await r.json();if(j.status===1)info=j.product}catch(e){}
  closeDlg();buy(null,null,null,c);
  if(info){$('#bN').value=info.product_name||'';$('#bBr').value=(info.brands||'').split(',')[0];$('#bSz').value=info.quantity||'';bTot();toast('Encontrado en Open Food Facts')}
  else toast('Producto nuevo: escríbele el nombre y quedará aprendido')}

// ----- GASTOS -----
function gastos(){
  const ps=S.purchases.filter(p=>inPeriod(p.date)).sort((a,b)=>a.date<b.date?1:-1),tot=ps.reduce((a,p)=>a+p.total,0);
  const byC={},byS={};ps.forEach(p=>{const c=prod(p.pid)?.cat||'otros';byC[c]=(byC[c]||0)+p.total;byS[p.store]=(byS[p.store]||0)+p.total});
  let h=`<div class="card"><h2>Este periodo <span class="price">${money(tot)}</span></h2>
  <button class="p" style="width:100%" onclick="buy()">＋ Registrar gasto suelto</button></div>`;
  if(tot){h+=`<div class="card"><h2>¿En qué se va?</h2>`;
    Object.entries(byC).sort((a,b)=>b[1]-a[1]).forEach(([c,v])=>{h+=`<div style="margin:6px 0"><div class="row" style="justify-content:space-between"><span>${CATS[c]}</span><span class="price">${money(v)} · ${Math.round(v/tot*100)}%</span></div><div class="hb"><i style="width:${v/tot*100}%"></i></div></div>`});
    h+=`<div class="cat">Por tienda</div>`+Object.entries(byS).map(([s,v])=>`<span class="chip">${esc(s)}: ${money(v)}</span>`).join('')+`</div>`}
  h+=`<div class="card"><h2>Movimientos</h2>`;
  if(!ps.length)h+=`<div class="empty">Aún no registras compras en este periodo.<br>Marca ✓ en tu lista o usa “Registrar gasto suelto”.</div>`;
  const groups={};ps.forEach(p=>{const k=p.date+'|'+p.store;(groups[k]=groups[k]||[]).push(p)});
  Object.entries(groups).forEach(([k,g])=>{const [d,st]=k.split('|');h+=`<div class="cat" style="display:flex;justify-content:space-between"><span>${fdate(d)} · ${esc(st)}</span><span>${g.length} ítems · ${money(g.reduce((a,x)=>a+x.total,0))}</span></div>`;
    g.forEach(p=>{const pr=prod(p.pid);h+=`<div class="it" onclick="buy(null,null,'${p.id}')"><div class="n"><b>${esc(pname(p.pid))}</b><small>${p.noPrice?'<span class="chip w">⚠️ falta precio</span> ':''}${p.qty} × ${money(p.price)}${pr?.size?' · '+esc(pr.size):''}</small></div><span class="price">${money(p.total)}</span></div>`})});
  if(ps.length)h+=`<p class="mut">Toca un gasto para corregirlo. Compara el total de cada tienda con tu factura.</p>`;
  const old=S.purchases.length-ps.length;if(old)h+=`<p class="mut">${old} compras de periodos anteriores siguen guardadas para el historial de precios.</p>`;
  return h+`</div>`;
}
function delPurchase(id){if(!confirm('¿Borrar este gasto?'))return;S.purchases=S.purchases.filter(p=>p.id!==id);S.prices=S.prices.filter(o=>o.purchase!==id);render()}

let pq='';
function precios(){
  const list=S.products.filter(p=>!pq||slug(p.name).includes(slug(pq))).sort((a,b)=>a.name.localeCompare(b.name));
  let h=`<div class="card"><div class="row"><input placeholder="Buscar producto…" value="${esc(pq)}" oninput="pq=this.value;clearTimeout(window._pq);window._pq=setTimeout(()=>{render();const i=$('#main input');i.focus();i.setSelectionRange(i.value.length,i.value.length)},250)">
  <button class="p" onclick="newProduct()">＋</button></div>
  <p class="mut" style="margin:8px 0 0">Anota precios aunque no compres: así el sistema aprende qué tienda te sale más barata.</p></div><div class="card">`;
  list.forEach(p=>{const stores=S.settings.stores.map(s=>[s,latest(p.id,s)]).filter(x=>x[1]);
    const all=obsOf(p.id),tr=all.length>1?all[0].price-all[1].price:0;
    h+=`<div class="it" onclick="openProduct('${p.id}')"><div class="n"><b>${esc(p.name)}</b><small>${p.size||p.brand?`<span class="mut">${esc([p.brand,p.size].filter(Boolean).join(' · '))} ${unitPrice(est(p.id),p.size)?'· '+unitPrice(est(p.id),p.size):''}</span><br>`:''}${stores.length?stores.map(([s,o])=>`<span class="chip">${esc(s)} ${money(o.price)}</span>`).join(''):`Ref. ${money(p.ref.min)}${p.ref.max>p.ref.min?' – '+money(p.ref.max):''}`}</small></div>
    <span class="price">${money(est(p.id))}${tr>0?' <span style="color:var(--bad)">▲</span>':tr<0?' <span style="color:var(--ok)">▼</span>':''}</span></div>`});
  if(!list.length)h+=`<div class="empty">Sin resultados.</div>`;
  return h+`</div>`;
}

  openDlg(`<h3>🏷️ ${esc(p.name)}</h3>
  ${p.brand||p.size?`<p class="mut" style="margin:-6px 0 8px">${esc([p.brand,p.size].filter(Boolean).join(' · '))}${unitPrice(est(id),p.size)?' · '+unitPrice(est(id),p.size):''}</p>`:''}
  ${best?`<p style="margin:0 0 8px">Más barato visto: <b>${money(best.price)}</b> en <b>${esc(best.store)}</b> (${fdate(best.date)})</p>`:''}
  ${storeLinks(p.name)}
  <label>Anotar precio observado</label><div class="row"><select id="oS" style="width:45%">${opts}</select><input id="oP" inputmode="numeric" placeholder="Precio"><button class="p" onclick="addObs('${id}')">＋</button></div>
  ${obs.length?`<table style="margin-top:10px"><tr><th>Fecha</th><th>Tienda</th><th>Precio</th><th></th></tr>${obs.slice(0,15).map(o=>`<tr><td>${fdate(o.date)}</td><td>${esc(o.store)}</td><td class="price">${money(o.price)}</td><td>${o.src==='compra'?'🛒':'👀'} <button class="g sm" onclick="delObs('${o.id}','${id}')">✕</button></td></tr>`).join('')}</table>`:'<p class="mut">Aún no hay precios registrados.</p>'}
  <details style="margin-top:10px"><summary>Editar producto</summary>
  <label>Nombre</label><input id="pN" value="${esc(p.name)}">
  <div class="grid2"><div><label>Categoría</label><select id="pC">${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${p.cat===k?'selected':''}>${v}</option>`).join('')}</select></div>
  <div><label>Prioridad</label><select id="pPr">${[1,2,3].map(n=>`<option value="${n}" ${p.prio==n?'selected':''}>${PRIO[n]}</option>`).join('')}</select></div>
  <div><label>Ref. mín.</label><input id="pMin" inputmode="numeric" value="${p.ref.min}"></div><div><label>Ref. máx.</label><input id="pMax" inputmode="numeric" value="${p.ref.max}"></div>
  <div><label>Unidad</label><input id="pU" value="${esc(p.unit)}"></div><div><label>Marca</label><input id="pB" value="${esc(p.brand||'')}"></div>
  <div><label>Presentación</label><input id="pS" value="${esc(p.size||'')}" placeholder="500 g"></div><div><label>Códigos de barras</label><input id="pK" value="${esc((p.codes||[]).join(', '))}" inputmode="numeric"></div></div>
  <div class="acts"><button class="d" onclick="delProduct('${id}')">Eliminar</button><button onclick="saveProduct('${id}')">Guardar cambios</button></div></details>
  <div class="acts"><button onclick="addListFromProd('${id}')">＋ A la lista</button><button class="p" onclick="closeDlg()">Listo</button></div>`)}
function addObs(id){const price=num($('#oP').value);if(!price)return toast('Escribe el precio');S.prices.push({id:uid(),pid:id,store:$('#oS').value,price,date:today(),ts:Date.now(),src:'obs'});save();openProduct(id);renderHeader();toast('Precio anotado')}
function delObs(oid,id){S.prices=S.prices.filter(o=>o.id!==oid);save();openProduct(id)}
function saveProduct(id){const p=prod(id);p.name=$('#pN').value.trim()||p.name;p.cat=$('#pC').value;p.prio=+$('#pPr').value;p.ref={min:num($('#pMin').value),max:num($('#pMax').value)||num($('#pMin').value)};p.unit=$('#pU').value;p.brand=$('#pB').value.trim();p.size=$('#pS').value.trim();p.codes=$('#pK').value.split(',').map(x=>x.trim()).filter(Boolean);closeDlg();render();toast('Guardado')}
function delProduct(id){if(!confirm('¿Eliminar producto y sus precios?'))return;S.products=S.products.filter(p=>p.id!==id);S.prices=S.prices.filter(o=>o.pid!==id);S.list=S.list.filter(i=>i.pid!==id);closeDlg();render()}
function addListFromProd(id){const ex=S.list.find(i=>i.pid===id&&!i.done);if(ex)ex.qty++;else S.list.push({id:uid(),pid:id,qty:1,done:false});closeDlg();render();toast('Agregado a la lista')}
function newProduct(){openDlg(`<h3>Nuevo producto</h3><label>Nombre</label><input id="nN" placeholder="Ej: Leche deslactosada 1L">
  <div class="grid2"><div><label>Categoría</label><select id="nC">${Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>

  <div class="acts"><button class="g" onclick="closeDlg()">Cancelar</button><button class="p" onclick="createProduct()">Crear</button></div>`)}
function createProduct(){const n=$('#nN').value.trim();if(!n)return;const id=ensureProduct(n,$('#nC').value),p=prod(id),r=num($('#nR').value);p.prio=+$('#nP').value;p.ref={min:r,max:r};p.unit=$('#nU').value;closeDlg();render();toast('Producto creado')}

// ----- LISTAS -----
let gen=null;
function tplTotal(t){return t.items.reduce((a,i)=>a+est(i.pid)*i.qty,0)}
function listas(){
  const rem=Math.max(0,S.settings.budget-spent());
  let h=`<div class="card"><h2>✨ Lista sugerida por presupuesto</h2>
  <p class="mut" style="margin-top:0">Arma una lista empezando por lo esencial, con tus últimos precios vistos, y deja una reserva.</p>
  <div class="grid2"><div><label>¿Cuánto quieres gastar?</label><input id="gB" inputmode="numeric" value="${gen?gen.budget:Math.round(rem)}"></div>
  <div><label>Guardar de reserva</label><select id="gR">${[0,10,20,30,40].map(n=>`<option value="${n}" ${n==S.settings.reserve?'selected':''}>${n}%</option>`).join('')}</select></div></div>
  <div class="row" style="margin-top:8px;flex-wrap:wrap">${[50000,100000,150000].map(v=>`<button class="sm" onclick="$('#gB').value=${v};genList()">${money(v)}</button>`).join('')}
  <button class="p" style="flex:1" onclick="genList()">Generar</button></div>`;
  if(gen){h+=`<div style="margin-top:12px">`;
    gen.items.forEach(i=>{h+=`<div class="it"><div class="n"><b>${esc(pname(i.pid))}</b><small>${i.qty} · ${PRIO[prod(i.pid).prio]}</small></div><span class="price">${money(est(i.pid)*i.qty)}</span></div>`});
    h+=`<p class="row" style="justify-content:space-between"><span>Total <b>${money(gen.total)}</b></span><span class="mut">Reserva ${money(gen.budget-gen.total)}</span></p>
    ${gen.skipped.length?`<p class="mut">No alcanzó: ${gen.skipped.map(esc).join(', ')}</p>`:''}
    <div class="acts"><button onclick="saveGen()">💾 Guardar</button><button class="p" onclick="useGen()">Usar como lista</button></div></div>`}
  h+=`</div><div class="card"><h2>📚 Mis listas guardadas</h2>`;
  if(!S.templates.length)h+=`<div class="empty">No hay listas guardadas.</div>`;
  S.templates.forEach(t=>{h+=`<div class="it"><div class="n"><b>${esc(t.name)}${S.settings.basket===t.id?' <span class="chip">canasta base</span>':''}</b><small>${t.items.length} productos · aprox. ${money(tplTotal(t))}</small></div>
    <button class="sm" onclick="loadTpl('${t.id}')">Cargar</button><button class="g" onclick="tplMenu('${t.id}')">⋯</button></div>`});
  return h+`</div>`;
}
function genList(){
  const budget=num($('#gB').value),res=+$('#gR').value,target=budget*(1-res/100);
  const has=n=>S.pantry.some(x=>slug(n).split('-').some(w=>w.length>3&&slug(x.name).includes(w)));
  const cand=S.products.filter(p=>est(p.id)>0).sort((a,b)=>a.prio-b.prio||est(a.id)-est(b.id));
  let total=0;const items=[],skipped=[];
  for(const p of cand){if(p.prio>1&&has(p.name))continue;const c=est(p.id);if(total+c<=target){items.push({pid:p.id,qty:1});total+=c}else if(p.prio<3)skipped.push(p.name)}
  gen={budget,total,items,skipped};S.settings.reserve=res;render()}

function cerebro(){

  else if(sp+pe>st.budget-resAmt){const cut=S.list.filter(i=>!i.done&&prod(i.pid)?.prio===3).map(i=>pname(i.pid));T.push(['⚠️','Se come la reserva',`Si compras todo lo pendiente quedarías con ${money(rem-pe)}, menos que tu reserva de ${money(resAmt)}.${cut.length?' Puedes dejar para después: '+cut.join(', ')+'.':''}`])}

  const wins={};let cmp=0;S.products.forEach(p=>{const os=st.stores.map(s=>latest(p.id,s)).filter(Boolean);if(os.length>1){cmp++;const b=os.reduce((a,o)=>o.price<a.price?o:a);wins[b.store]=(wins[b.store]||0)+1}});
  if(cmp){const w=Object.entries(wins).sort((a,b)=>b[1]-a[1])[0];T.push(['🏪','Tienda más barata',`${w[0]} fue la más barata en ${w[1]} de ${cmp} productos que has comparado.`])}
  else T.push(['🏪','Compara tiendas','Anota el precio de un mismo producto en D1, Ara u Olímpica (pestaña Precios) y aquí te diré cuál te conviene.']);
  // alzas
  const ups=[];S.products.forEach(p=>{const o=obsOf(p.id);if(o.length>1&&o[0].price>o[1].price*1.1)ups.push(`${p.name} (+${Math.round((o[0].price/o[1].price-1)*100)}%)`)});
  if(ups.length)T.push(['📈','Subieron de precio',ups.slice(0,5).join(', ')]);
  // canasta
  const bt=S.templates.find(t=>t.id===st.basket);
  if(bt){const now=tplTotal(bt),ref=bt.items.reduce((a,i)=>{const p=prod(i.pid);return a+(p?(p.ref.min+p.ref.max)/2*i.qty:0)},0);
    const per=st.stores.map(s=>{let tot=0,ok=0;bt.items.forEach(i=>{const o=latest(i.pid,s);if(o){tot+=o.price*i.qty;ok++}});return[s,tot,ok]}).filter(x=>x[2]);
    T.push(['🧺',`Tu canasta “${bt.name}”`,`Hoy cuesta aprox. ${money(now)} (con precios de referencia era ${money(ref)}; ${now>ref?'subió '+money(now-ref):'bajó '+money(ref-now)}).${per.length?' Por tienda: '+per.map(([s,t,ok])=>`${s} ${money(t)} (${ok}/${bt.items.length} prod.)`).join(' · '):''}`])}
  // ritmo de consumo: aprende cada cuánto compras algo
  const due=[];S.products.forEach(p=>{const ds=[...new Set(S.purchases.filter(x=>x.pid===p.id).map(x=>x.date))].sort();if(ds.length<2)return;
    const gap=daysBetween(ds[0],ds[ds.length-1])/(ds.length-1),next=addDays(ds[ds.length-1],Math.round(gap));if(gap>=3&&daysBetween(today(),next)<=4)due.push(`${p.name} (cada ~${Math.round(gap)} días)`)});
  if(due.length)T.push(['🔁','Pronto se te acaba',due.join(', ')]);
  const np=S.purchases.filter(x=>x.noPrice).length;if(np)T.push(['⚠️','Compras sin precio',`Tienes ${np} compra(s) sin precio. Importa la factura y se completan solas.`]);
  // menú
  const pan=S.pantry.map(x=>slug(x.name)).join(' '),has=w=>pan.includes(w),M=[];
  if(has('lenteja'))M.push('Lentejas guisadas con hogao, zanahoria y papa, con arroz');
  if(has('huevo'))M.push('Huevos pericos con arepa');
  if(has('pasta')||has('espagueti'))M.push('Pasta con tomate y ajo');
  if(has('avena'))M.push('Avena cocida con leche y panela');
  if(has('papa')&&has('huevo'))M.push('Tortilla de papa');
  if(M.length)T.push(['🍲','Cocina con lo que tienes',M.join(' · ')]);
  const tip=TIPS[new Date().getDate()%TIPS.length];T.push(tip);
  let h=`<div class="card"><h2>🧠 Lo que veo</h2>${T.map(([e,t,p])=>`<div class="tip"><div class="e">${e}</div><div><b>${esc(t)}</b><p>${esc(p)}</p></div></div>`).join('')}</div>`;
  h+=`<div class="card"><h2>🤖 Pregúntale al Cerebro</h2>
  ${aiKey()?`<textarea id="aq" rows="2" placeholder="Ej: ¿qué compro con lo que me queda hasta el 15?"></textarea><div class="acts" style="margin-top:8px"><button class="p" onclick="askAI()">Preguntar</button></div><div id="aa" style="white-space:pre-wrap;font-size:14px"></div>`
  :`<p class="mut" style="margin-top:0">Para preguntarle aquí y leer fotos de facturas, agrega tu clave de la API de Claude abajo. Sin clave, copia tu contexto y pégalo en tu proyecto “Mercado Mensual”.</p>`}
  <div class="acts" style="justify-content:stretch"><button style="flex:1" onclick="copyCtx()">📋 Copiar contexto</button>${navigator.share?`<button onclick="shareCtx()">Compartir</button>`:''}</div>
  <details style="margin-top:8px"><summary>🔑 Clave de IA</summary><p class="mut">Se guarda solo en este teléfono y no va en las copias de seguridad. Créala en console.anthropic.com.</p>
  <input id="ak" type="password" value="${esc(aiKey())}" placeholder="sk-ant-…"><label>Modelo</label><input id="am" value="${esc(aiModel())}">
  <div class="acts"><button onclick="saveAI()">Guardar clave</button></div></details></div>`;
  h+=`<div class="card"><h2>⚙️ Ajustes del periodo</h2>
  <div class="grid2"><div><label>Presupuesto</label><input id="sB" inputmode="numeric" value="${st.budget}"></div><div><label>Reserva %</label><input id="sR" type="number" value="${st.reserve}"></div>
  <div><label>Desde</label><input id="sS" type="date" value="${st.start}"></div><div><label>Hasta</label><input id="sE" type="date" value="${st.end}"></div>
  <div><label>Tienda habitual</label><select id="sT">${st.stores.map(s=>`<option ${s===st.store?'selected':''}>${esc(s)}</option>`).join('')}</select></div>
  <div><label>Tiendas (separadas por coma)</label><input id="sL" value="${esc(st.stores.join(', '))}"></div></div>
  <div class="acts"><button onclick="newPeriod()">🔄 Nueva quincena</button><button class="p" onclick="saveSettings()">Guardar</button></div></div>`;
  h+=`<div class="card"><h2>💾 Copia de seguridad</h2><p class="mut" style="margin-top:0">Todo vive solo en este dispositivo. Descarga una copia de vez en cuando.</p>
  <div class="acts" style="justify-content:flex-start"><button onclick="exportData()">Descargar copia</button><button onclick="$('#imp').click()">Restaurar copia</button><button class="d" onclick="resetAll()">Borrar todo</button></div>
  <input id="imp" type="file" accept=".json,application/json" hidden onchange="importData(this.files[0])"></div>`;
  return h;
}

function fixCode(c){const m={O:'0',o:'0',D:'0',Q:'0',I:'1',l:'1',i:'1',L:'1',Z:'2',z:'2',A:'4',S:'5',s:'5',G:'6',T:'7',B:'8',R:'7',g:'9'};c=c.replace(/./g,x=>m[x]??x).replace(/\D/g,'');return c.length>=8&&c.length<=14?c:''}
function parseReceipt(t){const items=[];let total=0;
  t.split(/\n/).forEach(l=>{l=l.trim();
    const m=l.match(/([0-9A-Za-z€?]{11,14})\s+(.+?)\s+(\d{1,3})\s*U[NM]?\S*\s+([\d.,]{3,})\s+([\d.,]{3,})\s*\S{0,2}$/);
    if(m){let code=fixCode(m[1]),qty=+m[3],u=num(m[4]),tt=num(m[5]),warn='';
      if(qty*u!==tt){if(u&&tt%u===0&&tt/u<=50)qty=tt/u;else warn='Revisa cantidad y precio'}
      items.push({code,desc:m[2].replace(/\s+[A-Z]$/,'').trim(),qty,price:u,warn})}
    const tm=[...l.matchAll(/total\s*:?\s*\$?\s*([\d.,]{4,})/ig)];tm.forEach(x=>{const v=num(x[1]);if(v>1000)total=v})});
  return{items,total}}
function rcText(){const {items,total}=parseReceipt($('#rcT').value);
  if(!items.length)return $('#rcM').textContent='No encontré productos en ese texto. Revisa que cada línea tenga código, nombre, cantidad y precios.';
  rcReview({store:S.settings.store,date:today(),total,items})}
async function rcOCR(f){if(!f)return;const M=$('#rcM');M.textContent='Preparando el lector (la primera vez descarga ~5 MB)…';

    const bmp=await createImageBitmap(f),k=Math.min(1,2200/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');c.width=bmp.width*k;c.height=bmp.height*k;
    const x=c.getContext('2d');x.filter='grayscale(1) contrast(1.6)';x.drawImage(bmp,0,0,c.width,c.height);
    const w=await Tesseract.createWorker('spa',1,{logger:m=>{if(m.status==='recognizing text')M.textContent='Leyendo factura… '+Math.round(m.progress*100)+'%'}});
    await w.setParameters({tessedit_pageseg_mode:'6'});const {data}=await w.recognize(c);await w.terminate();
    const r=parseReceipt(data.text);if(!r.items.length){$('#rcT').value=data.text;return M.textContent='No pude reconocer líneas de productos. Te dejé el texto leído arriba para corregirlo, o intenta otra foto más recta y con buena luz.'}
    const st=/ara/i.test(data.text)&&/jer[oó]nimo|tiendas ara/i.test(data.text)?'Ara':/d1\b|koba/i.test(data.text)?'D1':/ol[ií]mpica/i.test(data.text)?'Olímpica':S.settings.store;

  }catch(e){M.textContent='⚠️ No pude leer la foto: '+e.message}}
async function rcPhoto(f){if(!f)return;$('#rcM').textContent='Leyendo la factura… (10-30 s)';

Precios en pesos sin puntos. Mis productos (id: nombre):\n${plist}`}],4000);

function rcMatch(it){let p=byCode(it.code);if(!p&&it.code&&it.code.length>=8)p=S.products.find(x=>(x.codes||[]).some(k=>k.endsWith(it.code)));if(p){if(!(p.codes||[]).includes(it.code))it.code='';return p.id}if(it.code&&it.code.length<12)it.code='';if(it.pid&&prod(it.pid))return it.pid;
  const ws=slug(it.desc).split('-').filter(w=>w.length>=3);let best=null,sc=0;
  S.products.forEach(p=>{const pw=slug(p.name).split('-');const n=ws.filter(w=>pw.some(x=>x.startsWith(w))).length;if(n>sc){sc=n;best=p.id}});return sc?best:''}
function rcReview(r){r.items.forEach(it=>{it.pid=rcMatch(it);it.on=true;it.name=it.name||it.desc});rc=r;rcRender()}

  <div><label>Fecha</label><input type="date" value="${r.date}" onchange="rc.date=this.value"></div></div>
  ${r.items.map((it,i)=>`<div style="border-top:1px solid var(--line);padding:8px 0;${it.on?'':'opacity:.45'}">
    <div class="row"><input type="checkbox" ${it.on?'checked':''} style="width:auto" onchange="rc.items[${i}].on=this.checked;rcRender()"><b style="flex:1;font-size:13px">${esc(it.desc)}${it.warn?` <span class="chip b">⚠️ ${it.warn}</span>`:''}${it.code?'':' <span class="chip w">sin código</span>'}</b><span class="price">${money(it.qty*it.price)}</span></div>
    <div class="row" style="margin-top:4px"><select style="font-size:13px" onchange="rc.items[${i}].pid=this.value;rcRender()">${popts(it.pid)}</select><input style="width:56px;font-size:13px" type="number" step="any" value="${it.qty}" onchange="rc.items[${i}].qty=+this.value;rc.items[${i}].warn='';rcRender()"><input style="width:80px;font-size:13px" inputmode="numeric" value="${it.price}" onchange="rc.items[${i}].price=num(this.value);rc.items[${i}].warn='';rcRender()"></div>
    ${it.pid?'':`<input style="margin-top:4px;font-size:13px" value="${esc(it.name)}" onchange="rc.items[${i}].name=this.value" placeholder="Nombre del producto nuevo">`}</div>`).join('')}
  <div class="card" style="margin:10px 0 0;padding:10px"><div class="row" style="justify-content:space-between"><span>Suma</span><b class="price">${money(sum)}</b></div>
  <div class="row" style="justify-content:space-between;margin-top:6px"><span>Total factura</span><input style="width:110px" inputmode="numeric" value="${r.total||''}" onchange="rc.total=num(this.value);rcRender()"></div>
  ${r.total?`<p style="margin:6px 0 0;color:${Math.abs(sum-r.total)<2?'var(--ok)':'var(--bad)'}">${Math.abs(sum-r.total)<2?'✓ Cuadra con la factura':'Diferencia: '+money(sum-r.total)+' — revisa cantidades o precios'}</p>`:''}</div>
  <button style="width:100%;margin-top:8px" onclick="rc.items.push({code:'',desc:'Producto agregado',name:'',qty:1,price:0,pid:'',on:true});rcRender()">＋ Agregar línea que no leyó</button>
  <div class="acts"><button class="g" onclick="closeDlg()">Cancelar</button><button class="p" onclick="rcSave()">Registrar ${r.items.filter(i=>i.on).length} productos</button></div>`)}
function rcSave(){const r=rc;let n=0;
  r.items.filter(i=>i.on&&i.price).forEach(it=>{let pid=it.pid;
    if(!pid){pid=ensureProduct(it.name||it.desc,it.cat||'otros');const p=prod(pid);if(it.brand)p.brand=it.brand;if(it.size)p.size=it.size}
    const p=prod(pid);if(it.code){p.codes=p.codes||[];if(!p.codes.includes(it.code))p.codes.push(it.code)}
    const ts=Date.now()+n++,ex=S.purchases.find(x=>x.pid===pid&&x.date===r.date&&!x._rc);let id;
    if(ex){id=ex.id;Object.assign(ex,{qty:it.qty,price:it.price,total:Math.round(it.qty*it.price),store:r.store,noPrice:false,_rc:1});S.prices=S.prices.filter(x=>x.purchase!==id)}
    else{id=uid();S.purchases.push({id,pid,qty:it.qty,price:it.price,total:Math.round(it.qty*it.price),store:r.store,date:r.date,ts,_rc:1})}
    S.prices.push({id:uid(),pid,store:r.store,price:it.price,date:r.date,ts,src:'compra',purchase:id});
    const li=S.list.find(x=>x.pid===pid&&!x.done);if(li){li.done=true;li.paid=Math.round(it.qty*it.price)}});
  S.purchases.forEach(x=>delete x._rc);closeDlg();rc=null;go('gastos');toast(n+' compras registradas ✓')}

// ===== Diálogo =====
function openDlg(h){$('#dlgIn').innerHTML=h;const d=$('#dlg');if(!d.open)d.showModal()}
function closeDlg(){$('#dlg').close()}
$('#dlg').addEventListener('click',e=>{if(e.target.id==='dlg')closeDlg()});

go('lista');
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
